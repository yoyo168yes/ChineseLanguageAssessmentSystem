/* ===================== 自訂右鍵選單 ===================== */
(function initContextMenu() {
    const menu = document.getElementById('contextMenu');
    if (!menu) return;
    let lastTarget = null;
    let lastSelectedText = '';
    let lastSelStart = null;
    let lastSelEnd = null;

    function isEditable(el) {
        return !!el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') && !el.disabled && !el.readOnly;
    }

    function showMenu(e) {
        lastTarget = e.target;
        const sel = window.getSelection();
        lastSelectedText = sel ? sel.toString() : '';
        if (isEditable(lastTarget)) {
            lastSelStart = lastTarget.selectionStart;
            lastSelEnd = lastTarget.selectionEnd;
        } else {
            lastSelStart = null;
            lastSelEnd = null;
        }

        menu.style.display = 'block';
        const mw = menu.offsetWidth;
        const mh = menu.offsetHeight;
        let x = e.clientX;
        let y = e.clientY;
        if (x + mw > window.innerWidth - 2) x = window.innerWidth - mw - 2;
        if (y + mh > window.innerHeight - 2) y = window.innerHeight - mh - 2;
        menu.style.left = Math.max(0, x) + 'px';
        menu.style.top = Math.max(0, y) + 'px';
    }
    function hideMenu() { menu.style.display = 'none'; }

    function fallbackCopyText(text) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.top = '-9999px';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        let ok = false;
        try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
        document.body.removeChild(ta);
        return ok;
    }

    async function doCopy() {
        let text = lastSelectedText;
        if (!text && isEditable(lastTarget)) {
            const el = lastTarget;
            const start = (lastSelStart != null) ? lastSelStart : 0;
            const end = (lastSelEnd != null) ? lastSelEnd : el.value.length;
            text = (start !== end) ? el.value.substring(start, end) : el.value;
        }
        if (!text) {
            return;
        }
        let copied = false;
        if (navigator.clipboard && navigator.clipboard.writeText) {
            try { await navigator.clipboard.writeText(text); copied = true; } catch (err) { copied = false; }
        }
        if (!copied) { copied = fallbackCopyText(text); }
        if (!copied) { alert('複製失敗，請改用鍵盤快速鍵 Ctrl+C。'); }
    }

    function insertTextAtCursor(el, text) {
        el.focus();
        const start = (typeof el.selectionStart === 'number') ? el.selectionStart : el.value.length;
        const end = (typeof el.selectionEnd === 'number') ? el.selectionEnd : el.value.length;
        const before = el.value.substring(0, start);
        const after = el.value.substring(end);
        el.value = before + text + after;
        const newPos = start + text.length;
        if (el.setSelectionRange) el.setSelectionRange(newPos, newPos);
        el.dispatchEvent(new Event('input', { bubbles: true }));
    }

    async function doPaste() {
        if (!isEditable(lastTarget)) {
            return;
        }
        const el = lastTarget;
        if (navigator.clipboard && navigator.clipboard.readText) {
            try {
                const text = await navigator.clipboard.readText();
                insertTextAtCursor(el, text);
                return;
            } catch (err) {
                /* 權限被拒或瀏覽器不支援，改用下方提示 */
            }
        }
        alert('瀏覽器未授權讀取剪貼簿內容，請改用鍵盤快速鍵 Ctrl+V 貼上。');
    }

    document.addEventListener('contextmenu', function (e) {
        e.preventDefault();
        showMenu(e);
    });

    document.addEventListener('click', function (e) {
        if (menu.style.display === 'none') return;
        const item = e.target.closest ? e.target.closest('.ctx-item') : null;
        if (item) {
            const act = item.getAttribute('data-act');
            if (act === 'copy') { doCopy(); }
            else if (act === 'paste') { doPaste(); }
            else if (act === 'reload') { location.reload(); }
            else if (act === 'viewsource') { viewFakeSource(); }
        }
        hideMenu();
    });

    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') hideMenu();
    });

    window.addEventListener('blur', hideMenu);
})();
