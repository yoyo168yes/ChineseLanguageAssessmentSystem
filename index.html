/* ===================== 訪客計數器 ===================== */
const VISIT_COUNTER_KEY = 'visit_counter_v3';
const VISIT_COUNTER_START = 98758;
const VISIT_COUNTER_TARGET = 100000;

function getVisitCount() {
    try {
        const stored = localStorage.getItem(VISIT_COUNTER_KEY);
        const n = stored !== null ? parseInt(stored, 10) : (VISIT_COUNTER_START - 1);
        return isNaN(n) ? (VISIT_COUNTER_START - 1) : n;
    } catch (e) {
        return VISIT_COUNTER_START - 1;
    }
}
function updateVisitCounterDisplay(n) {
    const el = document.getElementById('visitCounter');
    if (el) el.textContent = String(n).padStart(6, '0');
}
function recordPageVisit() {
    let n = getVisitCount() + 1;
    try { localStorage.setItem(VISIT_COUNTER_KEY, String(n)); } catch (e) {}
    updateVisitCounterDisplay(n);
    if (n === VISIT_COUNTER_TARGET) {
        openMemory3Page();
        return true;
    }
    return false;
}

/* ===================== 畫面切換 ===================== */
function syncScreenURL(name, extra) {
    const url = new URL(window.location.href);
    url.search = '';
    url.hash = '';
    url.searchParams.set('screen', name);
    Object.entries(extra || {}).forEach(([key,value]) => url.searchParams.set(key,String(value)));
    try { window.history.replaceState(null, '', url.href); } catch (e) {}
}
function showScreen(name) {
    if (name !== 'quiz' && recordPageVisit()) return;
    if (name === 'quiz') syncScreenURL(name, {set:currentSetIndex,q:currentQuestionIndex});
    else if (name !== 'blog-post') syncScreenURL(name);
    stopReturnPopups();
    document.documentElement.classList.remove('inverted-idiom');
    ['home','sets','quiz','result','login','admin','admin-student-works','guestbook','blog','blog-post','blog-manage','draft-edit','search','student-works','idioms','classics-trivia','profile','image-view','message-backup','archived-message-20070321'].forEach(s => {
        document.getElementById('screen-' + s).classList.add('hidden');
    });
    document.getElementById('screen-' + name).classList.remove('hidden');
    window.scrollTo(0, 0);
    if (name === 'sets') renderSetList();
    if (name === 'guestbook') renderGuestbook(1);
    if (name === 'blog') renderBlogList();
    if (name === 'blog-manage') {
        if (!isLoggedIn) { showScreen('login'); return; }
        renderAdminBlogManage();
        renderDraftBox();
    }
    if (name === 'draft-edit') {
        if (!isLoggedIn) { showScreen('login'); return; }
    }
    if (name === 'admin-student-works') {
        if (!isLoggedIn) { showScreen('login'); return; }
        document.getElementById('archivedWorksArea').classList.add('hidden');
    }
    if (name === 'student-works') renderStudentWorks();
    if (name === 'idioms') renderIdiomDictionary();
    if (name === 'classics-trivia') renderClassicsTrivia();
}

function goScreen(e, name) {
    e.preventDefault();
    showScreen(name);
    return false;
}
function goHome(e) { return goScreen(e, 'home'); }

function showModal(messageHtml, buttons, theme) {
    const box = document.getElementById('modalBox');
    box.className = 'modal-box' + (theme === 'site' ? ' theme-site' : '');
    box.innerHTML = '<div class="modal-msg">' + messageHtml + '</div>';
    buttons.forEach(b => {
        const btn = document.createElement('a');
        btn.href = b.href || '#';
        btn.className = 'win98-btn';
        btn.textContent = b.label;
        btn.onclick = (e) => {
            e.preventDefault();
            hideModal();
            if (b.onClick) b.onClick();
        };
        box.appendChild(btn);
    });
    document.getElementById('modalOverlay').classList.remove('hidden');
}
function hideModal() {
    document.getElementById('modalOverlay').classList.add('hidden');
    document.getElementById('modalBox').innerHTML = '';
}

 {title:'冥婚與「撿紅包」：滿足宗法制度與安撫亡靈的習俗',html:'<p>在漢人傳統宗族觀念中，未婚女性過世後不能入列本生家族的祖先牌位，稱為「孤娘」，無法享有後代香火，易成為無主孤魂。家屬為安撫其靈魂，常將亡者生辰八字、指甲毛髮或照片放入紅包，置於路邊等候男性撿拾，強迫或協商促成「冥婚」。迎娶後，女方神主牌得以入男方祖龕，兼顧信仰撫慰與家族祭祀規範。</p>'},
 {title:'拜地基主：源自平埔族祀壺或屋基靈魂的家宅祭祀',html:'<p>地基主是台灣家宅守護神中層級最基層卻不可或缺的神祇。祭祀時通常在廚房朝向屋內、或從後門向客廳祭拜，供桌多使用矮凳，供品偏好雞腿便當。學界研究指出，地基主信仰揉合了漢人傳統的「基址神」觀念與台灣平埔原住民族的祖靈崇拜（如阿立祖、阿立母），反映了漢人移居拓墾時對原地靈魂與土地所有者的敬畏與融合。</p>'},
 {title:'牽水𰹬：悼念重大海難與水災亡靈的拔度科儀',html:'<p>主要盛行於雲林口湖、四湖等沿海地區，源自清道光二十五年（1845年）的「金湖大水災」，當時數千人罹難。「水𰹬」是一種以竹篾編製、外糊白紙或五色紙的圓筒狀法器，中空可旋轉，內置神明符令。法事進行時，信眾旋轉水𰹬，象徵轉動幽冥法輪，從水底深淵牽引水死幽魂脫離苦海、接受普度，是台灣少見因特大天災而衍生、列入無形文化資產的集體創傷療癒儀式。</p>'},
 {title:'祭無相太祖：全臺唯一有求必應的許願方法',html:'<p>無相太祖本為於戰爭中故去的烈士，據傳為數萬靈魂的集體，沒有固定的形貌，因此名曰無相。</p><p>全臺僅雲林虎尾的無相廟供奉其神尊，只在每年農曆七月初一、十五開放，屆時民眾可前往廟裡祭拜、許願，並在願望實現後於明年同一時間還願。</p><p>然而本站經無相太祖首肯，特設「許願廳」，讓無法親自到場的朋友能在線上許願。</p><p>以下為許願儀式的流程：</p><p>在線上或無相廟參拜，確認太祖受理願望後，找一空墳，取活雞喉頭血二兩、施術者淚水半碗，於初一子時誦咒七遍，再將凶物洗淨，放入空墳。<br>之後拋擲銅板，得三聖筊後焚燒銀紙百張，儀式方成。<br>待願望實現，將最初承諾的報酬放入空墳中，即完成還願。</p><p>註：「凶物」為任意殺生過後的器物，通常為取雞血用的刀具。<br>註2：空墳乃以無人使用之墓穴，然為保證信眾安全，可自行挖一長方形坑洞代替之。</p><div style="margin-top:18px;padding-top:10px;border-top:1px dotted #660000;font-size:12px;"><strong style="color:#999;">附件：</strong> <a href="https://images.plurk.com/x4EMfSvN8138QgPvCaTUZ.png" target="_blank" rel="noopener" style="color:#ffffff;text-decoration:underline;">無相太祖心印寶咒.jpg</a></div>'},
 {title:'搶孤：中元普度尾聲的幽靈救濟與民俗競技',html:'<p>盛行於宜蘭頭城與屏東恆春。中元節在款待好兄弟後，最後會舉行搶孤儀式。主辦方搭起數層樓高的巨大孤棚，立柱塗滿牛油，棚頂置有豐富祭品與搶孤旗。選手須以疊羅漢與倒掛技巧攀爬爭奪。這項儀式既象徵「與鬼爭食」、藉由陽剛喧鬧驅趕流連忘返的遊魂，亦帶有賑濟貧苦、撫慰早期渡海拓墾罹難孤魂的歷史底色。</p>'},
 {title:'打小人與祭白虎：驚蟄節氣的轉運儀式',html:'<p>多在二十四節氣的「驚蟄」進行。民間相信春雷乍響、百蟲與凶煞驚醒，白虎星君主口舌是非與血光之災。信眾會到宮廟（如土地公廟或王爺廟），用法事印有小人圖樣的紙張，由桌頭或法師持鞋底用力拍打，口中唸誦咒詞以化解冤親債主，並以生豬肉、鴨蛋或豆腐祭拜白虎，象徵餵飽虎口、封住是非與病害。</p>'},
 {title:'燒王船：王爺信仰中「代天巡狩」與逐瘟出境的極致展現',html:'<p>以屏東東港、台南西港等地最具代表性。王爺被視為玉皇大帝派來「代天巡狩」巡察人間的神祇。迎王平安祭典的最後高潮為送王（燒王船）：將象徵疫疾、凶煞與邪穢的實體神船移至海邊，填滿香燭白米物資後焚化，意即恭送王爺回天庭繳旨，同時將地方上的瘟疫與穢氣一併載走入海，達到地方淨化與保境安民的目的。</p>'},
 {title:'跳鍾馗：極具禁忌的高強度除煞科儀',html:'<p>常見於廟宇落成（入火安座）、大火火災後「謝土」、凶死出殯等場合。民間認為鍾馗為伏魔帝君，扮演鍾馗的法師（或懸絲傀儡）在開面（上妝）後即代表神祇，身負極大煞氣。儀式進行時通常嚴禁生人走動、孩童孕婦避開，更切忌現場直呼他人姓名，以免被遊魂煞氣盯上。法師透過步罡踏斗、揮劍、灑鹽米等動作驅逐隱匿不去的厲鬼。</p>'},
 {title:'觀落陰：深入幽冥探尋親人的民間通靈秘法',html:'<p>道教閭山派或民間法術中的一種「出魂術」。由法師誦念咒語、敲擊木魚法器，引導蒙著紅布的信眾進入出神狀態，意念遊歷地府或天界。常見目的為探訪已故親人的生活境況（過橋、探問）、查閱代表個人命運運勢的「元辰宮」（檢視屋舍結構、柴米油鹽、米缸花樹以論斷財運健康），是台灣民間兼具心靈撫慰、探問命運與生死對話色彩的法事。</p>'}
];

 {id:'who',title:'【創作】你是誰',date:'2008.04.01',body:"01\n　　據說，每天對著鏡子問十次「你是誰」，持續三十天之後，便會精神崩潰。\n　　以下是某人的實驗過程，我們在他失蹤之後，於寢室中的電腦發現寫著這份記錄的檔案。\n02\n　　第一天：\n　　今天是實驗的第一天，原本我是相當興奮啦，但即使問了十次「你是誰」也完全沒有恐怖的事情發生，有點掃興www\n　　果然這就只是都市傳說而已嘛，所謂的完形崩壞要是能發生在自我意識上面的話，那不就天下大亂了嗎（笑）不過為了闢謠，我會努力做完三十天挑戰的！\n\n　　第二天：\n　　差點就忘記要問了，於是在睡覺前趕快跑去，快速地問了十次，感覺自己像個白痴www\n\n　　第三天：\n　　堅持做某件事情真的很困難呢，像我唯一堅持每天都做的，應該就只有看漫畫了吧～～總而言之，今天問完之後也什麼都沒有發生！大家可以回家啦！\n\n　　第四天：\n　　你是誰、你是誰、你是誰、你是誰，像這樣講了十次之後，總覺得自己的臉看起來有點討厭欸！有句話說常常照鏡子的人都很自戀，但像我這樣的人，就算照了鏡子也不會喜歡上自己的啦（菸）\n\n　　第五天：\n　　今天問完十次之後，發現鏡子角落出現了裂痕。\n　　之前明明沒有的啊……有點恐怖，但也讓我情緒高漲起來啦！畢竟什麼都沒發生實驗就結束的話，那就不好玩了嘛！期待明天會出現什麼變化吧！\n\n　　第六天：\n　　裂痕擴大了，而且是非常明顯！昨天只有在角落，今天已經裂到中間了，實在超恐怖的啦。不過也沒辦法確定是因為實驗的關係，畢竟鏡子本來就很容易碎掉。\n\n　　第七天：\n　　裂痕沒有變大，我本來還以為整面鏡子都會碎咧～結果就只有這樣而已嗎？那還真是令人失望啊w\n　　「喂喂，給我來點勁爆的展開啦！」\n　　我這樣對鏡子裡的自己說道。\n\n　　第八天：\n　　（空白）\n\n　　第九天：\n　　我醒來之後發現日期往後跳了兩天，真是不可思議，我竟然把整整一天都睡掉了啦啊啊啊！當然馬上就跑去看鏡子囉，結果根本沒有變化，只是鏡子裡的人頭髮變白了而已……\n　　咦？那個人是我喔？\n　　我的頭髮，全部都變白了……\n\n　　第十天：\n　　實驗終於進行到三分之一，但我忽然不太想繼續了欸。\n　　不過除了繼續做下去也沒有別的辦法，畢竟都簽了約嘛，而且這個房間連窗戶都沒有，門也被鎖死了，只有食物會從天花板的小洞裡掉出來。\n　　原本以為只要三十天應該很簡單，畢竟只要對著鏡子問你是誰就有一百萬可以拿，任誰都會心動的吧！應該不會只有我吧？\n　　總而言之，今天我也乖乖地問了十次的「你是誰」，只是，鏡子裡的我好像不再開口了，不知為何始終緊閉著嘴唇。\n\n　　第十一天：\n　　那個人真的是我嗎？\n　　鏡子裡的傢伙，是我？\n\n　　第十二天：\n　　已經不知道該怎麼辦才好了。\n\n　　第十三天：\n　　天花板上掉下來的食物從泡麵變成了不明的肉塊，味道聞起來令人作嘔。\n　　我不斷嘗試尋找出口，最後把自己的小拇指吃掉了。\n　　好餓。\n\n　　第十四天：\n　　不管看什麼都變成一片紅色，鏡子裡的人也是紅色的。\n　　我喜歡紅色。\n\n　　第十五天：\n　　還剩一半。\n\n　　第十六天：\n　　（空白）\n\n　　第十七天：\n　　你是誰？\n\n　　第十八天：\n　　ji3cl3c94q841j6ul41j6ul4eji4x96\n03\n　　之後的日記是全都是亂碼，再也無法找到有意義的文字，持續到第二十一天，記錄變為空白。據說，這場實驗同時有數十名參加者，但所有人都在三十天之內失蹤了。\n　　完成實驗得到獎金的人，一個都沒有。\n　　明明他們被關在沒有出口的密閉空間裡，應該不可能會消失，由於整棟大樓都沒有設置監視器，並且位於深山中，參加者們究竟去了哪裡，至今依舊無解。\n　　實驗的負責人、召集人又是誰，也完全找不到線索。只能從他們留下的文件拼湊蛛絲馬跡，在觀看這些資料時，始終感到毛骨悚然，因為，這裡所有的文字，都是左右相反的。\n　　就像，這棟大樓不屬於這個世界，而是存在於鏡子之中一樣……",comments:DIAN_POST_COMMENTS_1},
 {id:'knock',title:'【創作】夜半不怕鬼敲門',date:'2008.05.19',body:"　　從小，我的爸爸就告訴我，平日不做虧心事，夜半不怕鬼敲門。\n　　剛開始我很害怕，所以很努力地當個乖孩子，不賴床、不剩飯、不說謊。\n　　可是我一直覺得很不服氣，因為虧心事，我爸爸經常在做。\n　　比方說他偷懶沒有掃地，把垃圾塞進沙發底下。\n　　比方說明明失業了卻天天假裝去上班，然後把不知道哪裡來的薪水交給媽媽。\n　　比方說他瞞著媽媽跟不認識的女人約會。\n　　這些我都沒有告訴媽媽，因為爸爸說我保守秘密的話，他就帶我去吃麥當勞。\n　　我邊啃漢堡邊問爸爸，你怕不怕鬼？\n　　爸爸說，當然怕。\n　　我說，你不是說平日不做虧心事，夜半不怕鬼敲門嗎？\n　　爸爸說，沒錯啊！\n　　我說，做虧心事的都是壞人，壞人才怕鬼，所以你是壞人。\n　　爸爸說，呵呵呵呵或許吧。\n\n　　我想，一定是爸爸見過鬼，他才會那麼怕鬼，可是問他，他又說從來沒有鬼敲過他的門。不知道為什麼，我突然好想見一次鬼，好想知道鬼是不是真的存在。\n　　要我像爸爸那樣是不可能的，於是年幼的我開始思考，「虧心事」具體是什麼事？到底要做到哪個程度，才會有鬼來敲我的門？我覺得這實在太模稜兩可了，殺人放火算虧心事吧，可偷看色情雜誌、闖紅燈、上廁所沒洗手這算嗎？有些人覺得算，有些人像我就覺得沒關係。\n　　所以，到底有沒有辦法找出一個明確的標準來判斷「虧心事」呢？\n　　我想大概就只能交由那沒事愛亂敲別人門的鬼了。\n　　如果我真的做了一件特別踰矩的事，鬼會來嗎？於是，我打算一件一件來確認。\n\n　　第一次我背著書包出門，沒去學校，跑到附近的網咖打了一天遊戲。我覺得這應該夠過分了，可是除了被媽媽和老師打了一頓之外，晚上什麼特別的事情都沒有發生。我躺在床上，整夜沒合眼，就為了等鬼來，可是直到天亮鬼都沒有出現。\n　　我想，大概蹺課不算虧心事。\n\n　　第二次我趁著隔壁班上體育課的時間跑進他們教室，偷走了一台名牌手機。我把手機藏在外套的口袋裡，整天不敢拿出來。回家之後把裡面資料全部格式化、拔掉了手機殼，隔天才帶去學校炫耀。\n　　我以為這比之前還要過分，可是鬼依然沒有出現，所以偷竊也不算。\n\n　　第三次我收了錢，跟幾個同學一起去揍不認識的人。我們在學校後花園找到他，在他還沒搞清楚怎麼回事之前，我把垃圾袋套在他的頭上。我們狠狠地踢他、踹他，一直持續到他再也叫不出來為止。畢竟錢已經拿了，不能手軟。\n　　後來聽說那同學肋骨斷了三根，不知道是誰踢斷的，我記得我沒有踹他的肋骨，可是也有可能不小心踢到。\n　　我害怕了許多天，覺得這次逃不掉了，鬼肯定會來，可是沒有。\n\n　　為什麼？為什麼鬼不來？為什麼我已經做了那麼多壞事，傷害了那麼多人，鬼依然不來？\n　　我想了許久，終於豁然開朗──世界上，根本就沒有鬼。\n　　我覺得很快樂，這表示我什麼都不用害怕了。我陸續又偷了許多東西，打了許多素不相識的人，一次比一次麻木，最先的愧咎感早已消失無蹤。\n\n　　今天，我把一個人活活打死了。\n　　他的脖子斷了，歪成正常人無法做到的姿勢，無力地垂在肩膀上。\n　　看著他在我面前斷氣，我冷靜得超乎自己的想像，因為我很清楚，這個地方很隱密，也沒有監視器，只要我不說，就沒有人會知道是我。我轉身離開，像往常一樣回到家，邊看電視邊吃晚飯。\n　　我在一條警察突襲賭場的新聞裡看見了被帶走的爸爸，雖然他的臉被打上馬賽克，可是我一眼就認出了他。\n　　他今天早上，就是穿著那套衣服出門的。\n　　我把電視關掉，心想或許不久之後警察就會打電話來，所以沒有特別提起。吃完飯我把自己關在房間，草草做完老師給的試卷便睡了。平常我不這麼早睡的，只是不知為何今天特別累。\n\n　　凌晨，我被一陣急促的撞擊聲吵醒，睜眼一看，有誰在房間的外面，不停拍著我的窗子。\n　　從模糊的輪廓可以看出，那人的頭垂在肩膀上，是正常人不可能辦到的姿勢，就像是我早上打死的那個人一樣。",comments:DIAN_POST_COMMENTS_2},
 {id:'paper-doll',title:'【創作】妹妹的紙娃娃',date:'2008.06.08',body:"　　妹妹走後，她的紙娃娃我全都丟掉了。\n　　我把那些厚紙做成的有著金黃色頭髮、藍色眼睛的紙娃娃，和它們的洋裝、皮包、高跟鞋全都裝在舊信封袋裡，用塑膠繩打包成捆，跟晚上的垃圾一起丟到樓下。\n　　這件事我沒有告訴爸爸，他要是知道了，肯定不准我把妹妹的東西丟掉。\n　　但是，我不願意再把這些紙娃娃留著。\n　　我總覺得，妹妹就是因為玩紙娃娃才會死掉的。\n\n　　約莫半年前開始，妹妹晚上就經常做惡夢，哭到雙頰通紅，非得要跟爸爸擠一張床，讓人抱著睡才罷休，問她夢見什麼，卻從來不肯說。\n　　剛開始我們不特別注意，情況卻越來越嚴重，妹妹開始厭食、不說話、精神恍惚，連最愛的紙娃娃也不玩了。\n　　爸爸帶妹妹去看醫生，卻也檢查不出毛病，那段時間，爸爸天天陪著妹妹去上學，偶爾我也會陪她，但除了這樣，我們好像什麼也幫不上忙。\n　　有次爸爸帶妹妹上學去了，我肚子痛請假在家，躺在床上翻來覆去，忽然覺得壓到什麼東西，起身一看，原來是一個紙娃娃。\n　　紙娃娃有著棕色的大波浪卷髮，穿著一件白色洋裝，已經很舊了，髒兮兮的，左腳還斷掉了。\n　　我認出這是妹妹最喜歡的一個娃娃，她還幫它取了名字，叫做瑤瑤，妹妹的小名就叫瑤瑤。她還偷偷告訴我，瑤瑤有個男朋友，叫做彥彥，他們以後是要結婚的，我卻從不知道彥彥指的是哪個娃娃。\n　　以前妹妹天天都要跟瑤瑤玩的，自從生了這「怪病」，很久沒拿出來了，瑤瑤的衣服全都收在一個鐵製餅乾盒裡。\n　　這娃娃是怎麼跑上床的？而且還壞了，是我壓壞的嗎？我趴在床上找了半天，楞是沒找到紙娃娃缺失的左腳。我只好放棄，去到妹妹房間，想把娃娃放回餅乾盒，推開房門的時候，還做了幾次深呼吸。\n　　妹妹很久不讓我進她的房間了，想來她也到了注意自己隱私的年紀，不免有些感慨。\n　　我輕手輕腳走進房間，餅乾盒就放在書桌上，蓋子是打開的。我靠近一看，發現有一個紙娃娃特別不同──甚至不能說是紙娃娃。\n　　那是一張照片，或者說，是一個從照片上剪下來的人。\n　　那是個小男孩，看起來跟妹妹差不多年紀，對著鏡頭的表情很靦腆，穿著紅色上衣、白色短褲，乖乖地站著。\n　　照片的背面，用鉛筆歪歪扭扭寫著兩個字：\n　　彥彥。\n　　我一個激靈，這是妹妹的筆跡！莫非妹妹口中的「彥彥」就是他？可是，他是誰？這張照片又是從哪裡剪下來的？妹妹不會照相，她房間也沒有相簿，相簿……我把照片丟在一邊，衝進爸爸房裡，從書櫃最下層搬出兩本厚厚的相簿。\n　　爸爸極少把相簿拿出來，都用塑膠袋包著的，所以上面積了很多灰塵，我把相簿拿出來的時候，塑膠袋上有些小小的手印。\n　　不會錯的，妹妹碰過這些相簿了。\n　　我蹲在地上，把相簿攤開，一頁頁地尋找那張被剪過的相片，最後終於被我看見了。\n　　那張相片背景像是公園，中間有個人形的缺口，小男孩原本應該就站在這裡。照片中只有他一個人，底下的日期水印標示著1988年十月。\n　　我輕輕地撕下那張相片，客廳的電話忽然響了，我立馬跑出去接，是爸爸打來的。\n　　妹妹出事了。\n　　在過馬路的時候，妹妹被一輛違規的車子輾過，左腿斷了，全身也都有受傷。\n　　我握著話筒，腦袋一片空白，猛然想起，紙娃娃瑤瑤斷掉的，也是左腿。\n\n　　妹妹住院的那晚，我和爸爸都沒睡。\n　　我看著坐在醫院椅子上憔悴的父親，突然想起什麼，問：「你知道彥彥這個人嗎？」\n　　爸爸明顯嚇到了，他轉過頭來看著我，沒有說話。\n　　「他是誰？」\n　　「……一個朋友的小孩。」\n　　「他現在人呢？」\n　　「不在了。」爸爸搖搖頭：「好久以前就走了，因為生病……」\n　　「什麼時候走的？」\n　　「七年前，你妹妹出生的那天。」\n　　我愣住了，遙遠的記憶浮上心頭，的確，好像曾經聽爸爸說過，有朋友的小孩去世的事情……只不過那時妹妹剛出生，根本沒有空閒去關心。\n　　可這是什麼意思？那個叫彥彥的小孩子，在妹妹出生的那天死了？那妹妹怎麼可能認識他？怎麼會知道他的名字？怎麼能那麼精準地從相簿中找到他的照片剪下來？\n　　或許……他們在什麼地方見過嗎？\n　　我問：「彥彥……是在醫院過世的嗎？」\n　　爸爸嘆了口氣：「對，跟你妹妹出生的是同一間醫院。」\n　　同一間醫院，同一天，興許還是同一個時辰……一個人死去，一個人誕生，他們原本是兩個不該交錯的靈魂，但是……我又想起妹妹曾說過的話，瑤瑤有個男朋友叫彥彥，他們有天要結婚。\n　　想到這裡，我竟有股不祥的預感，果然，妹妹沒有挺過這一劫。\n　　住院一星期後，妹妹走了。\n　　我一直覺得是「彥彥」把妹妹帶走的，甚至覺得，「彥彥」可能從妹妹出生那天，就一直看著她了。\n　　我把妹妹的紙娃娃打包丟掉，卻唯獨找不到「彥彥」和「瑤瑤」，為了找到這兩個紙娃娃，我幾乎把整間屋子都翻遍了。\n　　但是，它們就這樣憑空消失，沒有留下一點線索給我。\n\n　　好多年後的現在，我終於提起勇氣去到彥彥的墳前，發現在墓碑旁邊生滿雜草的泥土中，缺了左腿的「瑤瑤」和被從照片上剪下來的「彥彥」躺在那裡，兩個破爛的紙娃娃肩並著肩，手碰著手，看起來感情相當好的樣子。",comments:DIAN_POST_COMMENTS_3}
];

/* ===================== 開始作答 ===================== */
function startQuiz(setIndex, startQ) {
    currentSetIndex = setIndex;
    currentQuestionIndex = (typeof startQ === 'number' && !isNaN(startQ)) ? startQ : 0;
    if (recordPageVisit()) return;
    const set = QUIZ_SETS[setIndex];
    if (currentQuestionIndex < 0 || currentQuestionIndex >= set.questions.length) currentQuestionIndex = 0;
    userAnswers = new Array(set.questions.length).fill(null);
    showScreen('quiz');
    renderQuestion();
}
function retrySameSet() { startQuiz(currentSetIndex, 0); }

function renderQuestion() {
    const set = QUIZ_SETS[currentSetIndex];
    const q = set.questions[currentQuestionIndex];
    const total = set.questions.length;

    if (total === 0) {
        document.getElementById('quizHeaderTitle').childNodes[0].nodeValue = '瀏覽題庫＞' + set.name + '  ';
        document.getElementById('progressFill').style.width = '0%';
        document.getElementById('questionTitle').textContent = '已封存';
        document.getElementById('optionsArea').innerHTML = '';
        document.getElementById('hiddenLinkArea').innerHTML = '';
        document.getElementById('btnNext').classList.add('hidden');
        document.getElementById('btnSubmit').classList.add('hidden');
        return;
    }

    document.getElementById('quizHeaderTitle').childNodes[0].nodeValue = '題組：' + set.name + '  ';
    document.getElementById('progressFill').style.width = Math.round(((currentQuestionIndex + 1) / total) * 100) + '%';
    document.getElementById('questionTitle').innerHTML = '第 ' + (currentQuestionIndex + 1) + ' 題 / 共 ' + total + ' 題  ' + q.q;

    const optionsArea = document.getElementById('optionsArea');
    optionsArea.innerHTML = '';

    if (q.type === 'short') {
        const input = document.createElement('input');
        input.type = 'text';
        input.setAttribute('aria-label', q.q);
        input.autocomplete = 'off';
        input.style.cssText = 'width:100%;max-width:420px;box-sizing:border-box;padding:6px;font:inherit;';
        input.value = userAnswers[currentQuestionIndex] ?? '';
        input.oninput = () => { userAnswers[currentQuestionIndex] = input.value; };
        optionsArea.appendChild(input);
    }
    (q.options || []).forEach((opt, i) => {
        const label = document.createElement('label');
        label.className = 'option-label' + (userAnswers[currentQuestionIndex] === i ? ' selected' : '');
        const prefix = q.plainOptions ? '' : (String.fromCharCode(65 + i) + '：');
        label.innerHTML =
            '<input type="radio" name="opt" value="' + i + '" ' + (userAnswers[currentQuestionIndex] === i ? 'checked' : '') + '> ' +
            prefix + opt;
        label.onclick = () => selectAnswer(i);
        optionsArea.appendChild(label);
    });

    const hiddenLinkArea = document.getElementById('hiddenLinkArea');
    if (q.special === 'input7') {
        hiddenLinkArea.innerHTML =
            '<a href="javascript:void(0);" class="hidden-link" style="color:#FFFFFF; text-decoration:none; font-size:13px;" onclick="openMemoryPage();">不會</a>';
    } else {
        hiddenLinkArea.innerHTML = '';
    }

    const nextLink = document.getElementById('btnNext');
    const nextIdx = Math.min(total - 1, currentQuestionIndex + 1);
    nextLink.href = '?screen=quiz&set=' + currentSetIndex + '&q=' + nextIdx;
    nextLink.classList.toggle('hidden', currentQuestionIndex === total - 1);
    document.getElementById('btnSubmit').classList.toggle('hidden', currentQuestionIndex !== total - 1);
}

function selectAnswer(i) {
    userAnswers[currentQuestionIndex] = i;
    const set = QUIZ_SETS[currentSetIndex];
    const q = set.questions[currentQuestionIndex];

    if (q.special === "q4_chain" && i === q.answer) {
        triggerQuestion4Chain();
    }

    renderQuestion();
}

function goNext() {
    const set = QUIZ_SETS[currentSetIndex];
    const q = set.questions[currentQuestionIndex];
    if (currentQuestionIndex < set.questions.length - 1) {
        currentQuestionIndex++;
        if (recordPageVisit()) return;
        renderQuestion();
    }
}

function submitQuiz() {
    doSubmitScoring();
}

const RESULT_GLITCH_TEXT = {
    3: '平生無恨無貪嗔',
    6: '可哀可歎孤苦身',
    7: '地獄難留自絕鬼',
    9: '蒼天不渡<b>薄命人</b>'
};

function scoreDeadQuiz(set) {
    document.getElementById('btnDetails').classList.add('hidden');
    const wishAnswer = String(userAnswers[4] ?? '').trim();
    const marks = set.questions.map((q,i) => {
        if (q.special === 'wish') return q.answers.includes(String(userAnswers[i] ?? '').trim());
        return q.answers.includes(userAnswers[i]);
    });
    const count = marks.filter(Boolean).length;
    document.getElementById('scoreCorrect').textContent = count;
    document.getElementById('scoreTotal').textContent = set.questions.length;
    document.getElementById('scoreComment').textContent = '';
    document.getElementById('reviewList').innerHTML = marks.map((ok,i) =>
        i === 4
        ? '<div class="review-item" style="background:#000;color:#ff0000;border:1px solid #ff0000;">第 5 題：■■</div>'
        : '<div class="review-item ' + (ok ? 'correct' : 'wrong') + '">第 ' + (i+1) + ' 題：' + (ok ? '✔ 正確' : '✘ 錯誤') + '</div>').join('') +
        (marks[0] && marks[1] && marks[2] && marks[4] && wishAnswer !== '' ? '<p style="text-align:center;"><strong>但是他還活著</strong></p>' : '');
    document.getElementById('btnRetry').href = '?screen=quiz&set=' + currentSetIndex + '&q=0';
    showScreen('result');

    const firstFourAllCorrect = marks.slice(0, 4).every(Boolean);
    if (firstFourAllCorrect && wishAnswer === '') {
        setTimeout(() => {
            showModal('我已 經沒有 任何願 望了', [
                { label: '確認', onClick: () => showGoodbyeSearchResult() }
            ]);
        }, 1000);
    }
}

function doSubmitScoring() {
    const set = QUIZ_SETS[currentSetIndex];
    if (!set || set.questions.length === 0) return;


    if (set.id === 'set-dead') { scoreDeadQuiz(set); return; }
    let correctCount = 0;
    const reviewHtml = [];
    set.questions.forEach((q, i) => {
        const userAns = userAnswers[i];
        let isCorrect, userAnsText, correctAnsText;
        const letterText = (userAns === null || userAns === undefined) ? '（未作答）' : (q.plainOptions ? q.options[userAns] : String.fromCharCode(65 + userAns) + '：' + q.options[userAns]);
        const correctLetterText = q.plainOptions ? q.options[q.answer] : String.fromCharCode(65 + q.answer) + '：' + q.options[q.answer];
        if (q.alwaysCorrect) {
            isCorrect = true;
            userAnsText = letterText;
            correctAnsText = '';
        } else {
            isCorrect = userAns === q.answer;
            userAnsText = letterText;
            correctAnsText = correctLetterText;
        }
        if (isCorrect) correctCount++;

        const glitch = RESULT_GLITCH_TEXT[i];
        const extraLine = (glitch !== undefined)
            ? '<div class="r-answer" style="color:#999999; letter-spacing:2px;">' + glitch + '</div>'
            : (isCorrect || !correctAnsText ? '' : '<div class="r-answer">正確答案：' + correctAnsText + '</div>');

        reviewHtml.push(
            '<div class="review-item ' + (isCorrect ? 'correct' : 'wrong') + '">' +
                '<div class="r-title">第 ' + (i + 1) + ' 題：' + q.q + '</div>' +
                '<div class="r-answer">你的答案：' + userAnsText + (isCorrect ? ' ✔ 正確' : ' ✘ 錯誤') + '</div>' +
                extraLine +
            '</div>'
        );
    });

    document.getElementById('scoreCorrect').textContent = correctCount;
    document.getElementById('scoreTotal').textContent = set.questions.length;

    const pct = correctCount / set.questions.length;
    let comment = '';
    if (pct === 1) comment = '★ 太棒了！全部答對，你是國語文小達人！★';
    else if (pct >= 0.8) comment = '表現優異，只差一點就滿分囉！';
    else if (pct >= 0.6) comment = '表現不錯，再加把勁就能更進步！';
    else comment = '再多複習一下，下次一定可以進步的！';
    document.getElementById('scoreComment').textContent = comment;

    document.getElementById('reviewList').innerHTML = reviewHtml.join('');
    document.getElementById('btnDetails').classList.toggle('hidden', set.id !== 'set1');
    const retryLink = document.getElementById('btnRetry');
    if (retryLink) retryLink.href = '?screen=quiz&set=' + currentSetIndex + '&q=0';
    showScreen('result');

    if (set.id === 'set1' && correctCount === set.questions.length) {
        showModal('<span style="color:#FF2222;">題組死</span> 已封 存', [
            { label: '確認' }
        ]);
    }

    const specialIndices = [3, 6, 7, 9];
    const specialAllUnanswered = specialIndices.every(i => {
        const a = userAnswers[i];
        return a === null || a === undefined || a === '';
    });
    const othersAllCorrect = set.questions.every((q, i) => {
        if (specialIndices.includes(i)) return true;
        const userAns = userAnswers[i];
        return q.alwaysCorrect || userAns === q.answer;
    });
    if (specialAllUnanswered && othersAllCorrect) {
        showModal('你以 為 這樣就能 逃 掉嗎', [
            { label: '確認', onClick: () => openEndingPage() }
        ]);
    }
}

function renderIdiomDictionary() {
    const container = document.getElementById('idiomList');
    container.innerHTML = '';
    IDIOM_GROUPS.forEach(group => {
        const heading = document.createElement('h4');
        heading.className = 'idiom-grade';
        heading.textContent = group.name;
        container.appendChild(heading);
        const grid = document.createElement('div');
        grid.className = 'idiom-grid';
        group.cells.forEach(words => {
            const cell = document.createElement('div');
            cell.className = 'idiom-cell';
            words.forEach(word => {
                const link = document.createElement('a');
                const id = IDIOM_ARTICLES[word];
                link.textContent = word;
                link.href = id ? '?screen=blog-post&id=' + id : '#';
                link.onclick = e => { e.preventDefault(); if (id) openBlogPost(id); };
                cell.appendChild(link);
            });
            grid.appendChild(cell);
        });
        container.appendChild(grid);
    });
}

function renderClassicsTrivia() {
    const list = document.getElementById('classicsTriviaList');
    list.innerHTML = '';
    CLASSICS_TRIVIA.slice(0,10).forEach(item => {
        const row = document.createElement('div');
        row.style.cssText = 'margin:8px 0;';
        const a = document.createElement('a');
        a.href = '?screen=blog-post&id=' + item.id;
        a.textContent = item.title;
        a.onclick = e => { e.preventDefault(); openBlogPost(item.id); };
        row.appendChild(a); list.appendChild(row);
    });
    const pager = document.createElement('div');
    pager.className = 'guest-pager';
    ['‹ 上一頁', '1', '2', '3', '4', '5', '下一頁 ›'].forEach((text, index) => {
        const link = document.createElement('a');
        link.href = '#';
        link.textContent = text;
        if (index < 2) link.className = 'active-page';
        if (index === 1) link.setAttribute('aria-current', 'page');
        link.onclick = e => { e.preventDefault(); if (index >= 2) alert('暫不開放！'); };
        pager.appendChild(link);
    });
    list.appendChild(pager);
}

function renderFakeLinkList(dataArr, containerId) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';
    const ul = document.createElement('ul');
    ul.className = 'fake-link-list';
    dataArr.forEach((item) => {
        const li = document.createElement('li');
        const a = document.createElement('a');
        if (item.real) {
            a.href = item.href || 'javascript:void(0)';
            a.className = 'plain-search-link';
            a.textContent = item.title;
            a.onclick = (e) => { e.preventDefault(); item.action(); };
        } else {
            a.href = 'javascript:void(0)';
            a.className = 'fake-link';
            a.textContent = item.title + (item.tag ? '（' + item.tag + '）' : '');
        }
        li.appendChild(a);
        ul.appendChild(li);
    });
    container.appendChild(ul);
}

function loadGuestMessagesBase() {
    try {
        const raw = localStorage.getItem(GUEST_STORAGE_KEY);
        if (raw) {
            let saved = JSON.parse(raw);
            if (Array.isArray(saved) && localStorage.getItem('guestbook_new_messages_200512_v1') !== '1') {
                const additions = [
                    {name:'♀天使♀小蕾',content:'樓下泥再說蛇摸???@@',date:'2005-12-12',reply:null},
                    {name:'店小三',content:'XL3G 5J4SU3YL3B4D; ZJ4',date:'2005-12-12',reply:null},
                    {name:'火箭隊的喵喵',content:'他忘記換輸入法啦 你自己看看那些英文在你鍵盤上面是哪個注音\n我常常用這種方式設密碼 比較好記',date:'2005-12-13',reply:null},
                    {name:'AAA',content:'原來不是只有我這樣弄密碼XDD',date:'2005-12-16',reply:null}
                ];
                additions.forEach(a => {
                    if (!saved.some(m => m.name === a.name && m.date === a.date && m.content === a.content)) saved.push(a);
                });
                saveGuestMessages(saved);
                localStorage.setItem('guestbook_new_messages_200512_v1', '1');
            }
            return saved;
        }
        const legacy = JSON.parse(localStorage.getItem('guestbook_messages_v2') || '[]');
        if (Array.isArray(legacy) && legacy.length) {
            const playerMessages = legacy.filter(m => !LEGACY_GUEST_SIGNATURES.has(JSON.stringify([m.name,m.content,m.date,m.reply])));
            const migrated = GUEST_SEED.concat(playerMessages);
            saveGuestMessages(migrated);
            return migrated;
        }
    } catch (e) {}
    return GUEST_SEED.slice();
}

function saveGuestMessages(msgs) {
    try { localStorage.setItem(GUEST_STORAGE_KEY, JSON.stringify(msgs)); } catch (e) {}
}

function escapeHtml(text) {
    return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function renderGuestbook(page) {
    const allMsgs = loadGuestMessages().slice().sort((a, b) => (a.date < b.date ? 1 : (a.date > b.date ? -1 : 0)));
    const totalPages = Math.max(1, Math.ceil(allMsgs.length / GUEST_PAGE_SIZE));
    if (page) currentGuestPage = page;
    if (currentGuestPage > totalPages) currentGuestPage = totalPages;
    if (currentGuestPage < 1) currentGuestPage = 1;

    const start = (currentGuestPage - 1) * GUEST_PAGE_SIZE;
    const pageMsgs = allMsgs.slice(start, start + GUEST_PAGE_SIZE);

    const list = document.getElementById('guestbookList');
    const count = document.getElementById('guestCount');
    list.innerHTML = '';
    count.textContent = '目前共有 ' + allMsgs.length + ' 則留言，歡迎留下您的足跡！（第 ' + currentGuestPage + ' / ' + totalPages + ' 頁）';

    pageMsgs.forEach(m => {
        const div = document.createElement('div');
        div.className = 'guest-msg';
        div.innerHTML =
            '<div class="g-head"><span class="g-name">▸ ' + escapeHtml(m.name) +
            '</span><span class="g-date">' + escapeHtml(m.date) + '</span></div>' +
            '<div class="g-body">' + escapeHtml(m.content).replace(/\\n/g, '<br>') + (m.hiddenText ? '<br><span style="color:#FFFFFF;">' + escapeHtml(m.hiddenText) + '</span>' : '') + '</div>' +
            (m.reply ? '<div class="g-reply"><span class="g-reply-label">站長回覆：</span>' + escapeHtml(m.reply).replace(/\\n/g, '<br>') + '</div>' : '');
        list.appendChild(div);
    });

    const pager = document.getElementById('guestPager');
    pager.innerHTML = '';
    if (totalPages > 1) {
        const prev = document.createElement('a');
        prev.href = 'javascript:void(0)';
        prev.textContent = '‹ 上一頁';
        if (currentGuestPage === 1) { prev.className = 'active-page'; }
        prev.onclick = (e) => { e.preventDefault(); if (currentGuestPage > 1) renderGuestbook(currentGuestPage - 1); };
        pager.appendChild(prev);

        for (let p = 1; p <= totalPages; p++) {
            const btn = document.createElement('a');
            btn.href = 'javascript:void(0)';
            btn.className = (p === currentGuestPage ? 'active-page' : '');
            btn.textContent = String(p);
            btn.onclick = ((pageNum) => (e) => { e.preventDefault(); renderGuestbook(pageNum); })(p);
            pager.appendChild(btn);
        }

        const next = document.createElement('a');
        next.href = 'javascript:void(0)';
        next.textContent = '下一頁 ›';
        if (currentGuestPage === totalPages) { next.className = 'active-page'; }
        next.onclick = (e) => { e.preventDefault(); if (currentGuestPage < totalPages) renderGuestbook(currentGuestPage + 1); };
        pager.appendChild(next);
    }

    if (typeof page === 'number') {
        window.scrollTo(0, 0);
    }
}

function submitGuestMessage() {
    const nameEl = document.getElementById('guestName');
    const contentEl = document.getElementById('guestContent');
    const name = nameEl.value.trim();
    const content = contentEl.value.trim();
    if (!name || !content) { alert('請填寫暱稱與留言內容！'); return; }
    const now = new Date();
    const date = now.getFullYear() + '-' +
        String(now.getMonth() + 1).padStart(2, '0') + '-' +
        String(now.getDate()).padStart(2, '0');
    const msgs = loadGuestMessages();
    msgs.unshift({ name: name, content: content, date: date, reply: null });
    saveGuestMessages(msgs);
    nameEl.value = '';
    contentEl.value = '';
    renderGuestbook(1);
    alert('留言成功！感謝您的來訪。');
}

    {"id":"blog20050523","title":"賀！瀏覽人次突破1000","date":"2005-05-23","content":"這段時間每天最開心的，就是看著左下角的訪客數一點點增加，終於突破一千人，我簡直高興得在電腦前跳起來！\n想不到上線幾個月就能有這樣的成績，多虧各位老師還有我的學生們大力宣傳。\n妻始終不理解為什麼那小小的數字會讓我如此興奮，說我架設這個網站也沒有賺錢，就算有十萬人來看又怎樣？\n但我依然認為，在如今的網路世代，能「免費得到教學資源」是能造福眾人的。\n不如就以「十萬人次」為目標吧！\n學生告訴我，現在很流行在「無名小站」「灌水」跟「踏踏」，如果「踩」到特定數字，站長會送小禮物……如果這個網站達成了十萬人次，我該送給那位幸運的訪客什麼樣的驚喜呢？"},
    { id: 'blog20070608', title: '難得的再會', date: '2007-06-08', content: '今天一位已畢業的學生回來找我，他今年國二了，從前瘦小的模樣已不復見，變得又高又帥，儼然像個大人。雖然他在午休時間直接穿著國中制服跑來，毫不掩飾自己正在蹺課，讓我不禁捏了把冷汗。\n一下午的時間，我們聊了許多從前的事，許多我早已遺忘的課堂趣事、我對他說過的話，他竟然全都記得一清二楚。\n然而他的臉上卻隱隱蒙著一層陰霾，我一直猶豫該不該問，我已經不是他的班導師，他也不再是當年懵懂的孩子……但我察覺他眼裡的淚光時，還是握住他的手，堅定地告訴他：「如果你有什麼煩惱都可以告訴老師，老師永遠挺你喔！」\n學生終於笑了，我由衷期望他有光明的未來。', image: 'https://images.plurk.com/166y72pZntMk36wvrEh7YR.png' },
    { id: 'blog20050412', title: '關於筆名', date: '2005-04-12', content: '我的本名叫張育豐，但對學生自我介紹時，我總是會先說自己的筆名「鐵樹」，台語讀法是「thih chhiu」。\n聽見這個名字，學生們都會笑出來，他們問：「老師，你為什麼叫鐵樹啊！」\n我說：「鐵樹是一種植物，據說相當難見到它開花，有個成語叫『鐵樹開花』，用來譬喻及其罕見的事物。我取這個名字，是給自己一個期許：我希望自己能像鐵樹一樣，乍看平平無奇，有朝一日綻放出讓人驚艷的花朵。」\n現在的我，仍是樸拙的「鐵樹」，我的「花期」何時會來呢？' },
    { id: 'blog20051207', title: '重感冒', date: '2005-12-07', content: '自詡身強體健的我，竟也在這個冬天得了重感冒。\n\n已經發燒三天，妻幾乎是不眠不休地照顧我，好不容易今天好點了，趕緊來報一下平安。\n千萬別小看冬天的威力，小朋友們一定要穿暖衣服喔！' },
    { id: 'blog20050508', title: '母親節，我的反思', date: '2005-05-08', boldTerms: ['佳作'], content: '幾年前發生過一件事，使我開始避免讓學生寫「我的爸爸」或「我的媽媽」這一類作文，因為那往往涉及太多隱私，而且我們必須正視一個事實：並不是每個孩子都有幸福圓滿的家庭。\n那年母親節，我依循學校的慣例讓三年級的孩子們寫「我的媽媽」，每個班級都必須選出三篇作文參加比賽，得獎的作品會被展示在穿堂的公布欄上，作為母親節活動的宣傳。\n一片鉛筆的沙沙聲中，我忽然聽見了幾聲微弱的啜泣，有個男學生低著頭、握著鉛筆哭了起來。我不動聲色地走到他身旁，偌大的作文紙上歪歪扭扭地寫著一行字：我的媽媽在天上。\n那一刻，我感到自己做了相當壞的事情，竟逼著那麼小的孩子去觸碰心中的傷口。\n我彎下腰來，小聲問他是不是身體不舒服？要不要老師帶你去保健室？他點點頭，把作文紙捏在手裡跟我走出教室，我跟他說：「寫不出來也沒關係，把這份愛、這份想念放在心上，媽媽一定都知道！」\n學生用外套的袖子擦眼淚，我注意到他的衣服滿是髒污，好像很久沒洗過……\n後來我跟他一起到操場去，坐在大榕樹下的板凳上看雲、看打球的學生、看草地，他忽然說：「老師，我想把作文寫完，我想得獎，讓媽媽看到。」\n後來他的作文真的得了佳作，但那段時間我每次路過穿堂，都不忍多看一眼，因為我總是會想起那一天，那個在教室裡獨自哭泣的無助身影。' },

function renderBlogList(page) {
    const posts = loadBlogPosts().slice().sort((a, b) => (a.date < b.date ? 1 : -1));
    const totalPages = Math.max(1, Math.ceil(posts.length / 5));
    const currentPage = Math.max(1, Math.min(totalPages, Number.isInteger(page) ? page : (window.blogListPage || 1)));
    window.blogListPage = currentPage;
    const list = document.getElementById('blogList');
    list.innerHTML = '';
    if (posts.length === 0) {
        list.innerHTML = '<p style="font-size:13px; color:#888888; text-align:center;">目前尚無日誌。</p>';
        return;
    }
    posts.slice((currentPage - 1) * 5, currentPage * 5).forEach(p => {
        const a = document.createElement('a');
        a.className = 'blog-list-item';
        a.href = '?screen=blog-post&id=' + encodeURIComponent(p.id);
        a.innerHTML =
            '<div class="blog-title">▸ ' + escapeHtml(p.title) + '</div>' +
            '<div class="blog-date">' + escapeHtml(p.date) + '</div>';
        a.onclick = (e) => { e.preventDefault(); openBlogPost(p.id); };
        list.appendChild(a);
    });
    if (totalPages > 1) {
        const pager = document.createElement('div');
        pager.className = 'guest-pager';
        function addLink(text, target, inactive) {
            const a = document.createElement('a');
            a.href = '#'; a.textContent = text;
            if (inactive) a.className = 'active-page';
            if (text === String(currentPage)) a.setAttribute('aria-current','page');
            a.onclick = e => { e.preventDefault(); if (!inactive) { renderBlogList(target); window.scrollTo(0,0); } };
            pager.appendChild(a);
        }
        addLink('‹ 上一頁', currentPage - 1, currentPage === 1);
        for (let i = 1; i <= totalPages; i++) addLink(String(i), i, i === currentPage);
        addLink('下一頁 ›', currentPage + 1, currentPage === totalPages);
        list.appendChild(pager);
    }
}

{"id":"obituary-zhang","title":"訃告","date":"","backTo":"home","backLabel":"回首頁","content":"先兄 張育豐先生 已於中華民國九十八年七月二日辭世。\n承蒙各界生前照拂，家屬銘感於心，治喪事宜將另行通知，念先兄一生樸實，懇辭奠儀與花禮。\n先兄曾言，取「鐵樹」為筆名，是盼有朝一日，能開出讓人驚豔的花。\n如今重讀此語，益感哀慟。\n\n張府家屬　泣告"},
{"id":"classics-1","title":"什麼是「二十四節氣」？","content":"二十四節氣是古人觀察太陽運行與季節變化所建立的時間標記。將太陽在一年中沿黃道運行的路徑分成二十四等份，每隔十五度為一個節氣。\n\n春季：立春、雨水、驚蟄、春分、清明、穀雨。\n夏季：立夏、小滿、芒種、夏至、小暑、大暑。\n秋季：立秋、處暑、白露、秋分、寒露、霜降。\n冬季：立冬、小雪、大雪、冬至、小寒、大寒。\n\n節氣可幫助人們掌握農事與季節，但各地氣候不同，名稱不表示當天一定會出現相同的天氣。例如臺灣到了「大雪」，平地也不一定下雪。","date":"","backTo":"classics-trivia","backLabel":"回列表"},
{"id":"classics-4","title":"「唐宋八大家」是哪八位？","content":"唐宋八大家是唐宋時期八位散文家的合稱。\n\n唐代：韓愈、柳宗元。\n宋代：歐陽脩、蘇洵、蘇軾、蘇轍、王安石、曾鞏。\n\n其中蘇洵是蘇軾與蘇轍的父親，三人合稱「三蘇」。這個名稱主要是從散文成就來說，並不是八位詩人的排行榜。","date":"","backTo":"classics-trivia","backLabel":"回列表"},
{"id":"classics-5","title":"《論語》是誰的著作？","content":"《論語》主要記錄孔子及其弟子的言行，由孔子的弟子及後學編纂而成，並非孔子親筆寫成的一本書。\n\n內容涉及學習、做人、交友與政治等主題。例如「學而時習之，不亦說乎？」提醒人們學習之後還要溫習與實踐。這裡的「說」讀作「悅」，表示喜悅。","date":"","backTo":"classics-trivia","backLabel":"回列表"},
{"id":"classics-6","title":"什麼是「文房四寶」？","content":"文房四寶指筆、墨、紙、硯，是傳統書寫與繪畫的重要工具。\n\n筆：通常指毛筆，用來書寫或作畫。\n墨：可加水研磨，製成墨汁。\n紙：承載文字和圖畫。\n硯：用來磨墨、盛墨。\n\n寫毛筆字時，可以從握筆、坐姿與基本筆畫練習起，慢慢體會輕重、快慢所帶來的變化。","date":"","backTo":"classics-trivia","backLabel":"回列表"},
{"id":"classics-7","title":"「四書五經」包含哪些書？","content":"四書指《大學》《中庸》《論語》《孟子》。\n\n五經指《詩經》《尚書》《禮記》《易經》《春秋》。\n\n這些書籍在傳統儒家教育中占有重要地位，內容涵蓋詩歌、歷史、禮制、思想等領域。其中《大學》與《中庸》原本都是《禮記》中的篇章。","date":"","backTo":"classics-trivia","backLabel":"回列表"},
{"id":"classics-8","title":"古人說的「十二時辰」是什麼？","content":"古人將一晝夜分為十二個時辰，依序以十二地支命名。一個時辰約相當於現在的兩個小時。\n\n子時：23時至1時。\n丑時：1時至3時。\n寅時：3時至5時。\n卯時：5時至7時。\n辰時：7時至9時。\n巳時：9時至11時。\n午時：11時至13時。\n未時：13時至15時。\n申時：15時至17時。\n酉時：17時至19時。\n戌時：19時至21時。\n亥時：21時至23時。\n\n這是方便理解的現代鐘點對照；古代實際計時方式與今日並不完全相同。","date":"","backTo":"classics-trivia","backLabel":"回列表"},
{"id":"classics-9","title":"絕句與律詩有什麼不同？","content":"近體詩中，絕句通常有四句，律詩通常有八句。依每句字數，又常分為五言與七言。\n\n五言絕句：四句，每句五字。\n七言絕句：四句，每句七字。\n五言律詩：八句，每句五字。\n七言律詩：八句，每句七字。\n\n律詩的八句分為首聯、頷聯、頸聯、尾聯，中間兩聯通常講究對仗。除了句數與字數，近體詩也有押韻和平仄的規則。","date":"","backTo":"classics-trivia","backLabel":"回列表"},
{"id":"classics-10","title":"如何分辨「比喻」與「擬人」？","content":"比喻是借用另一種事物的特徵，幫助讀者理解所描寫的對象。\n例如：「月亮像一艘小船。」把彎月比作小船，讓形狀更鮮明。\n\n擬人是把人的動作、情感或性格賦予事物。\n例如：「微風輕輕唱著歌。」把風吹的聲音寫成唱歌，讓景物更生動。\n\n閱讀時可以問自己：這句話是在拿兩種事物作比較，還是讓事物像人一樣活動？同一句話也可能同時使用不只一種修辭。","date":"","backTo":"classics-trivia","backLabel":"回列表"},

    {"id":"idiom-moe-98200","title":"七上八下","date":"","boldTerms":["字　　詞","注　　音","漢語拼音","相 似 詞","相 反 詞","釋　　義"],"content":"字　　詞：七上八下\n注　　音：ㄑㄧ ㄕㄤˋ ㄅㄚ ㄒㄧㄚˋ\n漢語拼音：qī shàng bā xià\n相 似 詞：猶豫不安\n\n釋　　義：\n1. 形容心情起伏不定，忐忑不安。《董西廂》卷三：「君瑞心頭怒發，忿得七上八下，煩惱身心怎按納。」《水滸傳》第二六回：「心頭十五個吊桶打水，七上八下。」亦作「七上八落」。\n  2. 形容零落不齊。《紅樓夢》第四九回：「探春道：『林丫頭剛起來了，二姐姐又病了，終是七上八下的。』」","footerHtml":"<div style=\"font-size:9px; color:#999999; margin-top:20px; line-height:1.6; text-align:center;\">中華民國教育部（Ministry of Education, R.O.C.）。《重編國語辭典修訂本》（版本編號：2015_20260625）<br>網址：http://dict.revised.moe.edu.tw/</div>","backTo":"idioms","backLabel":"回列表","sourceUrl":"https://dict.revised.moe.edu.tw/dictView.jsp?ID=98200&q=1&word=%E4%B8%8B"},
    {"id":"idiom-moe-55674","title":"同心協力","date":"","boldTerms":["字　　詞","注　　音","漢語拼音","相 似 詞","相 反 詞","釋　　義"],"content":"字　　詞：同心協力\n注　　音：ㄊㄨㄥˊ ㄒㄧㄣ ㄒㄧㄝˊ ㄌㄧˋ\n漢語拼音：tóng xīn xié lì\n相 似 詞：團結一心、通力合作、同甘共苦、同心同德、同舟共濟、和衷共濟\n相 反 詞：同床異夢、爾虞我詐、離心離德、分崩離析\n\n釋　　義：\n團結一致，共同努力。《梁書．卷四五．王僧辯傳》：「討逆賊於咸陽，誅叛子於雲夢，同心協力，克定邦家。」《三國演義》第八一回：「今汝二人亦是昆仲之分，正當同心協力，共報父讎，奈何自相爭競，失其大義。」也作「同心并力」、「同心合力」、「協力同心」。","footerHtml":"<div style=\"font-size:9px; color:#999999; margin-top:20px; line-height:1.6; text-align:center;\">中華民國教育部（Ministry of Education, R.O.C.）。《重編國語辭典修訂本》（版本編號：2015_20260625）<br>網址：http://dict.revised.moe.edu.tw/</div>","backTo":"idioms","backLabel":"回列表","sourceUrl":"https://dict.revised.moe.edu.tw/dictView.jsp?ID=55674&q=1&word=%E5%90%8C"},
    {"id":"idiom-moe-16722","title":"半途而廢","date":"","boldTerms":["字　　詞","注　　音","漢語拼音","相 似 詞","相 反 詞","釋　　義"],"content":"字　　詞：半途而廢\n注　　音：ㄅㄢˋ ㄊㄨˊ ㄦˊ ㄈㄟˋ\n漢語拼音：bàn tú ér fèi\n相 似 詞：半途自畫、半途而罷、功虧一簣\n相 反 詞：堅持不懈、持之以恆、貫徹始終\n\n釋　　義：\n事情沒做成功就停止。比喻做事情有始無終。《三國演義》第一一四回：「臣已得祁山之寨，正欲收功，不期半途而廢。」《西遊記》第五七回：「沙僧只叫：『怎麼好！怎麼好！』這誠所謂半途而廢，中道而止也！」","footerHtml":"<div style=\"font-size:9px; color:#999999; margin-top:20px; line-height:1.6; text-align:center;\">中華民國教育部（Ministry of Education, R.O.C.）。《重編國語辭典修訂本》（版本編號：2015_20260625）<br>網址：http://dict.revised.moe.edu.tw/</div>","backTo":"idioms","backLabel":"回列表","sourceUrl":"https://dict.revised.moe.edu.tw/dictView.jsp?ID=16722&q=1&word=%E9%80%94"},
    {"id":"idiom-moe-41556","title":"大吃一驚","date":"","boldTerms":["字　　詞","注　　音","漢語拼音","相 似 詞","相 反 詞","釋　　義"],"content":"字　　詞：大吃一驚\n注　　音：ㄉㄚˋ ㄔ ㄧ ㄐㄧㄥ\n漢語拼音：dà chī yī jīng\n\n釋　　義：\n形容非常驚訝意外。《糊塗世界》卷一一：「伯旦心裡大吃一驚，急的直跳起來。」也作「大喫一驚」。","footerHtml":"<div style=\"font-size:9px; color:#999999; margin-top:20px; line-height:1.6; text-align:center;\">中華民國教育部（Ministry of Education, R.O.C.）。《重編國語辭典修訂本》（版本編號：2015_20260625）<br>網址：http://dict.revised.moe.edu.tw/</div>","backTo":"idioms","backLabel":"回列表","sourceUrl":"https://dict.revised.moe.edu.tw/dictView.jsp?ID=41556&la=0&powerMode=0"},
    {"id":"idiom-moe-138034","title":"自言自語","date":"","boldTerms":["字　　詞","注　　音","漢語拼音","相 似 詞","相 反 詞","釋　　義"],"content":"字　　詞：自言自語\n注　　音：ㄗˋ ㄧㄢˊ ㄗˋ ㄩˇ\n漢語拼音：zì yán zì yǔ\n\n釋　　義：\n獨語，自己對自己說話。《初刻拍案驚奇》卷一一：「老人點頭大喜，自言自語道：『計在此了。』」《紅樓夢》第六七回：「到了自己房中，將東西丟在一邊，嘴裡咕咕噥噥自言自語。」","footerHtml":"<div style=\"font-size:9px; color:#999999; margin-top:20px; line-height:1.6; text-align:center;\">中華民國教育部（Ministry of Education, R.O.C.）。《重編國語辭典修訂本》（版本編號：2015_20260625）<br>網址：http://dict.revised.moe.edu.tw/</div>","backTo":"idioms","backLabel":"回列表","sourceUrl":"https://dict.revised.moe.edu.tw/dictView.jsp?ID=138034"},
    {"id":"idiom-moe-101542","title":"勤能補拙","date":"","boldTerms":["字　　詞","注　　音","漢語拼音","相 似 詞","相 反 詞","釋　　義"],"content":"字　　詞：勤能補拙\n注　　音：ㄑㄧㄣˊ ㄋㄥˊ ㄅㄨˇ ㄓㄨㄛˊ\n漢語拼音：qín néng bǔ zhuó\n\n釋　　義：\n勤奮努力可以彌補天資的不足。如：「他的成功是勤能補拙的最佳典範。」","footerHtml":"<div style=\"font-size:9px; color:#999999; margin-top:20px; line-height:1.6; text-align:center;\">中華民國教育部（Ministry of Education, R.O.C.）。《重編國語辭典修訂本》（版本編號：2015_20260625）<br>網址：http://dict.revised.moe.edu.tw/</div>","backTo":"idioms","backLabel":"回列表","sourceUrl":"https://dict.revised.moe.edu.tw/dictView.jsp?ID=101542&la=0&powerMode=0"},
    {"id":"idiom-moe-130039","title":"手忙腳亂","date":"","boldTerms":["字　　詞","注　　音","漢語拼音","相 似 詞","相 反 詞","釋　　義"],"content":"字　　詞：手忙腳亂\n注　　音：ㄕㄡˇ ㄇㄤˊ ㄐㄧㄠˇ ㄌㄨㄢˋ\n漢語拼音：shǒu máng jiǎo luàn\n相 反 詞：從容不迫\n\n釋　　義：\n形容做事慌亂，失了條理。元．關漢卿《蝴蝶夢》第二折：「撲咚咚階下升衙鼓，諕的我手忙腳亂。」《醒世恆言．卷二〇．張廷秀逃生救父》：「父子三人量畫定了，動起斧鋸，手忙腳亂直做到晚。」也作「腳忙手亂」。","footerHtml":"<div style=\"font-size:9px; color:#999999; margin-top:20px; line-height:1.6; text-align:center;\">中華民國教育部（Ministry of Education, R.O.C.）。《重編國語辭典修訂本》（版本編號：2015_20260625）<br>網址：http://dict.revised.moe.edu.tw/</div>","backTo":"idioms","backLabel":"回列表","sourceUrl":"https://dict.revised.moe.edu.tw/dictView.jsp?ID=130039"},
    {"id":"idiom-moe-48863","title":"東張西望","date":"","boldTerms":["字　　詞","注　　音","漢語拼音","相 似 詞","相 反 詞","釋　　義"],"content":"字　　詞：東張西望\n注　　音：ㄉㄨㄥ ㄓㄤ ㄒㄧ ㄨㄤˋ\n漢語拼音：dōng zhāng xī wàng\n\n釋　　義：\n四周探望。《平妖傳》第一〇回：「只見那頭陀提著齊眉短棍在樹林左右行來步去，東張西望。」也作「東瞧西望」、「東張西覷」。","footerHtml":"<div style=\"font-size:9px; color:#999999; margin-top:20px; line-height:1.6; text-align:center;\">中華民國教育部（Ministry of Education, R.O.C.）。《重編國語辭典修訂本》（版本編號：2015_20260625）<br>網址：http://dict.revised.moe.edu.tw/</div>","backTo":"idioms","backLabel":"回列表","sourceUrl":"https://dict.revised.moe.edu.tw/dictView.jsp?ID=48863&q=1&word=%E8%A5%BF"},
    {"id":"idiom-moe-42100","title":"得意洋洋","date":"","boldTerms":["字　　詞","注　　音","漢語拼音","相 似 詞","相 反 詞","釋　　義"],"content":"字　　詞：得意洋洋\n注　　音：ㄉㄜˊ ㄧˋ ㄧㄤˊ ㄧㄤˊ\n漢語拼音：dé yì yáng yáng\n相 反 詞：書空咄咄、垂頭喪氣、怏怏不樂\n\n釋　　義：\n形容十分得意的樣子。《紅樓夢》第一〇三回：「只見香菱已哭得死去活來，寶蟾反得意洋洋。」也作「揚揚得意」。","footerHtml":"<div style=\"font-size:9px; color:#999999; margin-top:20px; line-height:1.6; text-align:center;\">中華民國教育部（Ministry of Education, R.O.C.）。《重編國語辭典修訂本》（版本編號：2015_20260625）<br>網址：http://dict.revised.moe.edu.tw/</div>","backTo":"idioms","backLabel":"回列表","sourceUrl":"https://dict.revised.moe.edu.tw/dictView.jsp?ID=42100&la=0&powerMode=0"},
    {"id":"idiom-moe-103488","title":"全力以赴","date":"","boldTerms":["字　　詞","注　　音","漢語拼音","相 似 詞","相 反 詞","釋　　義"],"content":"字　　詞：全力以赴\n注　　音：ㄑㄩㄢˊ ㄌㄧˋ ㄧˇ ㄈㄨˋ\n漢語拼音：quán lì yǐ fù\n相 似 詞：不遺餘力、竭盡全力、盡心盡力、全心全意\n相 反 詞：三心二意\n\n釋　　義：\n投入全部的心力。如：「勝負就在這一刻了，大家要全力以赴。」","footerHtml":"<div style=\"font-size:9px; color:#999999; margin-top:20px; line-height:1.6; text-align:center;\">中華民國教育部（Ministry of Education, R.O.C.）。《重編國語辭典修訂本》（版本編號：2015_20260625）<br>網址：http://dict.revised.moe.edu.tw/</div>","backTo":"idioms","backLabel":"回列表","sourceUrl":"https://dict.revised.moe.edu.tw/dictView.jsp?ID=103488&la=0&powerMode=0"},
    {"id":"idiom-moe-100334","title":"千變萬化","date":"","boldTerms":["字　　詞","注　　音","漢語拼音","相 似 詞","相 反 詞","釋　　義"],"content":"字　　詞：千變萬化\n注　　音：ㄑㄧㄢ ㄅㄧㄢˋ ㄨㄢˋ ㄏㄨㄚˋ\n漢語拼音：qiān biàn wàn huà\n相 似 詞：變化多端、變化無窮、變幻莫測、瞬息萬變\n相 反 詞：千篇一律、一成不變\n\n釋　　義：\n形容變化無窮。《文選．賈誼．鵩鳥賦》：「千變萬化兮，未始有極。」《紅樓夢》第三一回：「天地間都賦陰陽二氣所生，或正或邪，或奇或怪，千變萬化，都是陰陽順逆。」也作「千變萬狀」。","footerHtml":"<div style=\"font-size:9px; color:#999999; margin-top:20px; line-height:1.6; text-align:center;\">中華民國教育部（Ministry of Education, R.O.C.）。《重編國語辭典修訂本》（版本編號：2015_20260625）<br>網址：http://dict.revised.moe.edu.tw/</div>","backTo":"idioms","backLabel":"回列表","sourceUrl":"https://dict.revised.moe.edu.tw/dictView.jsp?ID=100334&la=0&powerMode=0"},
    {"id":"idiom-moe-156967","title":"飲水思源","date":"","boldTerms":["字　　詞","注　　音","漢語拼音","相 似 詞","相 反 詞","釋　　義"],"content":"字　　詞：飲水思源\n注　　音：ㄧㄣˇ ㄕㄨㄟˇ ㄙ ㄩㄢˊ\n漢語拼音：yǐn shuǐ sī yuán\n相 反 詞：忘恩負義、恩將仇報\n\n釋　　義：\n比喻不忘本。參見「飲流懷源」條。《兒女英雄傳》第二五回：「奉著這等二位恩情備至的翁姑，伴著這等一個才貌雙全的夫婿；飲水思源，打算自己當日受了八兩，此時定要還她半觔。」《官場現形記》第二八回：「小姪這個官兒，還是軍門所保，小姪飲水思源，豈有坐視之理？」","footerHtml":"<div style=\"font-size:9px; color:#999999; margin-top:20px; line-height:1.6; text-align:center;\">中華民國教育部（Ministry of Education, R.O.C.）。《重編國語辭典修訂本》（版本編號：2015_20260625）<br>網址：http://dict.revised.moe.edu.tw/</div>","backTo":"idioms","backLabel":"回列表","sourceUrl":"https://dict.revised.moe.edu.tw/dictView.jsp?ID=156967&q=1&word=%E6%B0%B4"},
    {"id":"idiom-moe-155580","title":"掩耳盜鈴","date":"","boldTerms":["字　　詞","注　　音","漢語拼音","相 似 詞","相 反 詞","釋　　義"],"content":"字　　詞：掩耳盜鈴\n注　　音：ㄧㄢˇ ㄦˇ ㄉㄠˋ ㄌㄧㄥˊ\n漢語拼音：yǎn ěr dào líng\n相 似 詞：自欺欺人\n\n釋　　義：\n比喻自欺欺人。參見「盜鐘掩耳」條。《程乙本紅樓夢》第九回：「那怕再念三十本《詩經》，也是掩耳盜鈴，哄人而已。」《鏡花緣》第一四回：「他雖用綾遮蓋，以掩眾人耳目，那知卻是掩耳盜鈴。」","footerHtml":"<div style=\"font-size:9px; color:#999999; margin-top:20px; line-height:1.6; text-align:center;\">中華民國教育部（Ministry of Education, R.O.C.）。《重編國語辭典修訂本》（版本編號：2015_20260625）<br>網址：http://dict.revised.moe.edu.tw/</div>","backTo":"idioms","backLabel":"回列表","sourceUrl":"https://dict.revised.moe.edu.tw/dictView.jsp?ID=155580&la=0&powerMode=0"},
    {"id":"idiom-moe-162544","title":"亡羊補牢","date":"","boldTerms":["字　　詞","注　　音","漢語拼音","相 似 詞","相 反 詞","釋　　義"],"content":"字　　詞：亡羊補牢\n注　　音：ㄨㄤˊ ㄧㄤˊ ㄅㄨˇ ㄌㄠˊ\n漢語拼音：wáng yáng bǔ láo\n相 反 詞：時不我與\n\n釋　　義：\n丟失了羊，就趕快修補羊圈，還不算晚。語本《戰國策．楚策四》：「臣聞鄙語曰：『見兔而顧犬，未為晚矣；亡羊而補牢，未為遲也。』」比喻犯錯後及時更正，尚能補救。宋．陸游〈秋興〉詩五首之三：「懲羹吹齏豈其非，亡羊補牢理所宜。」明．沈德符《萬曆野獲編．卷一二．徐州》：「要之是舉必當亟行。若遇有事更張，不免亡羊補牢矣。」","footerHtml":"<div style=\"font-size:9px; color:#999999; margin-top:20px; line-height:1.6; text-align:center;\">中華民國教育部（Ministry of Education, R.O.C.）。《重編國語辭典修訂本》（版本編號：2015_20260625）<br>網址：http://dict.revised.moe.edu.tw/</div>","backTo":"idioms","backLabel":"回列表","sourceUrl":"https://dict.revised.moe.edu.tw/dictView.jsp?ID=162544&la=0&powerMode=0"},
    {"id":"idiom-moe-121016","title":"持之以恆","date":"","boldTerms":["字　　詞","注　　音","漢語拼音","相 似 詞","相 反 詞","釋　　義"],"content":"字　　詞：持之以恆\n注　　音：ㄔˊ ㄓ ㄧˇ ㄏㄥˊ\n漢語拼音：chí zhī yǐ héng\n相 反 詞：半途而廢、一曝十寒、虎頭蛇尾\n\n釋　　義：\n有恆心的堅持到底。清．曾國藩〈諭紀澤〉：「爾之短處，在言語欠純訥，舉止欠端重，看書不能深入，而作文不能崢嶸。若能從此三事上下一番苦工，進之以猛，持之以恆，不過一二年，自爾精進而不覺。」","footerHtml":"<div style=\"font-size:9px; color:#999999; margin-top:20px; line-height:1.6; text-align:center;\">中華民國教育部（Ministry of Education, R.O.C.）。《重編國語辭典修訂本》（版本編號：2015_20260625）<br>網址：http://dict.revised.moe.edu.tw/</div>","backTo":"idioms","backLabel":"回列表","sourceUrl":"https://dict.revised.moe.edu.tw/dictView.jsp?ID=121016&q=1&word=%E4%B9%8B"},
    {"id":"idiom-moe-133376","title":"熟能生巧","date":"","boldTerms":["字　　詞","注　　音","漢語拼音","相 似 詞","相 反 詞","釋　　義"],"content":"字　　詞：熟能生巧\n注　　音：ㄕㄨˊ ㄋㄥˊ ㄕㄥ ㄑㄧㄠˇ\n漢語拼音：shú néng shēng qiǎo\n\n釋　　義：\n熟練了自然能領悟出竅門。《鏡花緣》第三一回：「俗語說的『熟能生巧』，舅兄昨日讀了一夜，不但他已嚼出此中意味，並且連寄女也都聽會，所以隨問隨答，毫不費事。」","footerHtml":"<div style=\"font-size:9px; color:#999999; margin-top:20px; line-height:1.6; text-align:center;\">中華民國教育部（Ministry of Education, R.O.C.）。《重編國語辭典修訂本》（版本編號：2015_20260625）<br>網址：http://dict.revised.moe.edu.tw/</div>","backTo":"idioms","backLabel":"回列表","sourceUrl":"https://dict.revised.moe.edu.tw/dictView.jsp?ID=133376&la=0&powerMode=0"},
    {"id":"idiom-moe-85583","title":"歡天喜地","date":"","boldTerms":["字　　詞","注　　音","漢語拼音","相 似 詞","相 反 詞","釋　　義"],"content":"字　　詞：歡天喜地\n注　　音：ㄏㄨㄢ ㄊㄧㄢ ㄒㄧˇ ㄉㄧˋ\n漢語拼音：huān tiān xǐ dì\n相 似 詞：歡欣鼓舞、喜氣洋洋、興高彩烈\n相 反 詞：愁眉苦臉\n\n釋　　義：\n非常歡喜高興的樣子。元．無名氏《謝金吾》第二折：「往常時見我來，便歡天喜地；今日見我來，甚是煩惱。」《初刻拍案驚奇》卷五：「正待要歡天喜地指日成親。」也作「喜地歡天」。","footerHtml":"<div style=\"font-size:9px; color:#999999; margin-top:20px; line-height:1.6; text-align:center;\">中華民國教育部（Ministry of Education, R.O.C.）。《重編國語辭典修訂本》（版本編號：2015_20260625）<br>網址：http://dict.revised.moe.edu.tw/</div>","backTo":"idioms","backLabel":"回列表","sourceUrl":"https://dict.revised.moe.edu.tw/dictView.jsp?ID=85583&la=0&powerMode=0"},
    {"id":"idiom-moe-99714","title":"鍥而不捨","date":"","boldTerms":["字　　詞","注　　音","漢語拼音","相 似 詞","相 反 詞","釋　　義"],"content":"字　　詞：鍥而不捨\n注　　音：ㄑㄧㄝˋ ㄦˊ ㄅㄨˋ ㄕㄜˇ\n漢語拼音：qiè ér bù shě\n\n釋　　義：\n鍥，鏤刻。捨，捨棄、停止。鍥而不捨指不斷刻下去而不停止。比喻堅持到底，奮勉不懈。如：「警方抱著鍥而不捨的精神努力追查，終於找出真兇。」也作「鍥而不舍」。","footerHtml":"<div style=\"font-size:9px; color:#999999; margin-top:20px; line-height:1.6; text-align:center;\">中華民國教育部（Ministry of Education, R.O.C.）。《重編國語辭典修訂本》（版本編號：2015_20260625）<br>網址：http://dict.revised.moe.edu.tw/</div>","backTo":"idioms","backLabel":"回列表","sourceUrl":"https://dict.revised.moe.edu.tw/dictView.jsp?ID=99714&la=0&powerMode=0"},
    {"id":"idiom-moe-88393","title":"集思廣益","date":"","boldTerms":["字　　詞","注　　音","漢語拼音","相 似 詞","相 反 詞","釋　　義"],"content":"字　　詞：集思廣益\n注　　音：ㄐㄧˊ ㄙ ㄍㄨㄤˇ ㄧˋ\n漢語拼音：jí sī guǎng yì\n相 似 詞：群策群力\n相 反 詞：一意孤行、孤行己見、獨斷專行\n\n釋　　義：\n語本三國蜀．諸葛亮〈教與軍師長史參軍掾屬〉：「夫參署者，集眾思，廣忠益也。」指彙集眾人的智慧，以獲得更廣更大的效益。《老殘遊記》第三回：「但凡聞有奇才異能之士，都想請來，也是集思廣益的意思。」","footerHtml":"<div style=\"font-size:9px; color:#999999; margin-top:20px; line-height:1.6; text-align:center;\">中華民國教育部（Ministry of Education, R.O.C.）。《重編國語辭典修訂本》（版本編號：2015_20260625）<br>網址：http://dict.revised.moe.edu.tw/</div>","backTo":"idioms","backLabel":"回列表","sourceUrl":"https://dict.revised.moe.edu.tw/dictView.jsp?ID=88393&la=0&powerMode=0"},
    {"id":"idiom-moe-93399","title":"見賢思齊","date":"","boldTerms":["字　　詞","注　　音","漢語拼音","相 似 詞","相 反 詞","釋　　義"],"content":"字　　詞：見賢思齊\n注　　音：ㄐㄧㄢˋ ㄒㄧㄢˊ ㄙ ㄑㄧˊ\n漢語拼音：jiàn xián sī qí\n\n釋　　義：\n看到賢能的人，便想效法他。《論語．里仁》：「見賢思齊焉，見不賢而內自省也。」晉．常璩《華陽國志．卷四．南中志》：「知足下追踵古人，見賢思齊。」也作「見德思齊」。","footerHtml":"<div style=\"font-size:9px; color:#999999; margin-top:20px; line-height:1.6; text-align:center;\">中華民國教育部（Ministry of Education, R.O.C.）。《重編國語辭典修訂本》（版本編號：2015_20260625）<br>網址：http://dict.revised.moe.edu.tw/</div>","backTo":"idioms","backLabel":"回列表","sourceUrl":"https://dict.revised.moe.edu.tw/dictView.jsp?ID=93399&la=1&powerMode=0"},
    {"id":"idiom-moe-161274","title":"未雨綢繆","date":"","boldTerms":["字　　詞","注　　音","漢語拼音","相 似 詞","相 反 詞","釋　　義"],"content":"字　　詞：未雨綢繆\n注　　音：ㄨㄟˋ ㄩˇ ㄔㄡˊ ㄇㄡˊ\n漢語拼音：wèi yǔ chóu móu\n相 似 詞：防患未然、早為之所、有備無患、預加防備\n相 反 詞：江心補漏、臨渴掘井\n\n釋　　義：\n鳥兒為了確保鳥巢的堅固，在未下雨前，便已著手修補窩巢。語本《詩經．豳風．鴟鴞》：「迨天之未陰雨，徹彼桑土，綢繆牖戶。」比喻事先預備，防患未然。《隋唐演義》第五二回：「況我家雖有預備，積儲幾倉，亦當未雨綢繆，要防自己饑饉。」","footerHtml":"<div style=\"font-size:9px; color:#999999; margin-top:20px; line-height:1.6; text-align:center;\">中華民國教育部（Ministry of Education, R.O.C.）。《重編國語辭典修訂本》（版本編號：2015_20260625）<br>網址：http://dict.revised.moe.edu.tw/</div>","backTo":"idioms","backLabel":"回列表","sourceUrl":"https://dict.revised.moe.edu.tw/dictView.jsp?ID=161274&la=0&powerMode=0"},
    {"id":"idiom-moe-96631","title":"居安思危","date":"","boldTerms":["字　　詞","注　　音","漢語拼音","相 似 詞","相 反 詞","釋　　義"],"content":"字　　詞：居安思危\n注　　音：ㄐㄩ ㄢ ㄙ ㄨㄟˊ\n漢語拼音：jū ān sī wéi\n\n釋　　義：\n處於安樂之境，要想到可能出現的危險、困難。《左傳．襄公十一年》：「居安思危，思則有備，有備無患。」《明史．卷一九二．鄭本公傳》：「陛下居安思危，當遠群小，節燕遊，以防一朝之患。」也作「居安慮危」、「處安思危」。","footerHtml":"<div style=\"font-size:9px; color:#999999; margin-top:20px; line-height:1.6; text-align:center;\">中華民國教育部（Ministry of Education, R.O.C.）。《重編國語辭典修訂本》（版本編號：2015_20260625）<br>網址：http://dict.revised.moe.edu.tw/</div>","backTo":"idioms","backLabel":"回列表","sourceUrl":"https://dict.revised.moe.edu.tw/dictView.jsp?ID=96631"},
    {"id":"idiom-moe-36386","title":"防微杜漸","date":"","boldTerms":["字　　詞","注　　音","漢語拼音","相 似 詞","相 反 詞","釋　　義"],"content":"字　　詞：防微杜漸\n注　　音：ㄈㄤˊ ㄨㄟˊ ㄉㄨˋ ㄐㄧㄢˋ\n漢語拼音：fáng wéi dù jiàn\n相 似 詞：防患未然\n相 反 詞：養癰遺患\n\n釋　　義：\n防備禍患的萌芽，杜絕亂源的開端。謂防患於未然。晉．韋謏〈啟諫冉閔〉：「請誅屏降胡，去單于之號，以防微杜漸。」宋．蘇軾〈論周穜擅議配享自劾劄子〉：「防微杜漸，蓋有深意。」也作「杜漸防萌」。","footerHtml":"<div style=\"font-size:9px; color:#999999; margin-top:20px; line-height:1.6; text-align:center;\">中華民國教育部（Ministry of Education, R.O.C.）。《重編國語辭典修訂本》（版本編號：2015_20260625）<br>網址：http://dict.revised.moe.edu.tw/</div>","backTo":"idioms","backLabel":"回列表","sourceUrl":"https://dict.revised.moe.edu.tw/dictView.jsp?ID=36386&la=0&powerMode=0"},
    {"id":"idiom-moe-14873","title":"悲歡離合","date":"","boldTerms":["字　　詞","注　　音","漢語拼音","相 似 詞","相 反 詞","釋　　義"],"content":"字　　詞：悲歡離合\n注　　音：ㄅㄟ ㄏㄨㄢ ㄌㄧˊ ㄏㄜˊ\n漢語拼音：bēi huān lí hé\n\n釋　　義：\n1. 比喻人世間的聚散無常。宋．蘇軾〈水調歌頭．明月幾時有〉詞：「人有悲歡離合，月有陰晴圓缺，此事古難全。」明．袁于令《西樓記》第一齣：「試看悲歡離合處，從教打動人腸。」也作「悲歡合散」、「悲歡聚散」。\n  2. 泛指人生所經歷的一切遭遇。如：「人生的悲歡離合就如走馬燈一樣，轉個不停！」","footerHtml":"<div style=\"font-size:9px; color:#999999; margin-top:20px; line-height:1.6; text-align:center;\">中華民國教育部（Ministry of Education, R.O.C.）。《重編國語辭典修訂本》（版本編號：2015_20260625）<br>網址：http://dict.revised.moe.edu.tw/</div>","backTo":"idioms","backLabel":"回列表","sourceUrl":"https://dict.revised.moe.edu.tw/dictView.jsp?ID=14873&la=0&powerMode=0"},
    {"id":"idiom-moe-128539","title":"世事難料","date":"","boldTerms":["字　　詞","注　　音","漢語拼音","相 似 詞","相 反 詞","釋　　義"],"content":"字　　詞：世事難料\n注　　音：ㄕˋ ㄕˋ ㄋㄢˊ ㄌㄧㄠˋ\n漢語拼音：shì shì nán liào\n\n釋　　義：\n世間的情況多變，難以預料。如：「世事難料，禍福無常。」","footerHtml":"<div style=\"font-size:9px; color:#999999; margin-top:20px; line-height:1.6; text-align:center;\">中華民國教育部（Ministry of Education, R.O.C.）。《重編國語辭典修訂本》（版本編號：2015_20260625）<br>網址：http://dict.revised.moe.edu.tw/</div>","backTo":"idioms","backLabel":"回列表","sourceUrl":"https://dict.revised.moe.edu.tw/dictView.jsp?ID=128539&la=0&powerMode=0"},
    {"id":"idiom-moe-156949","title":"飲鴆止渴","date":"","boldTerms":["字　　詞","注　　音","漢語拼音","相 似 詞","相 反 詞","釋　　義"],"content":"字　　詞：飲鴆止渴\n注　　音：ㄧㄣˇ ㄓㄣˋ ㄓˇ ㄎㄜˇ\n漢語拼音：yǐn zhèn zhǐ kě\n相 似 詞：挖肉補瘡、剜肉補瘡\n\n釋　　義：\n比喻只求解救眼前困難，而不顧將來的大禍患。參見「止渴飲鴆」條。如：「吸食毒品來解癮，無異是飲鴆止渴的自殺行為。」","footerHtml":"<div style=\"font-size:9px; color:#999999; margin-top:20px; line-height:1.6; text-align:center;\">中華民國教育部（Ministry of Education, R.O.C.）。《重編國語辭典修訂本》（版本編號：2015_20260625）<br>網址：http://dict.revised.moe.edu.tw/</div>","backTo":"idioms","backLabel":"回列表","sourceUrl":"https://dict.revised.moe.edu.tw/dictView.jsp?ID=156949&q=1&word=%E9%B4%86"},
    {"id":"idiom-moe-165298","title":"緣木求魚","date":"","boldTerms":["字　　詞","注　　音","漢語拼音","相 似 詞","相 反 詞","釋　　義"],"content":"字　　詞：緣木求魚\n注　　音：ㄩㄢˊ ㄇㄨˋ ㄑㄧㄡˊ ㄩˊ\n漢語拼音：yuán mù qiú yú\n\n釋　　義：\n爬到樹上去找魚。語本《孟子．梁惠王上》：「以若所為，求若所欲，猶緣木而求魚也。」比喻用錯方法，徒勞無功。《後漢書．卷一一．劉玄傳》：「今以所重加非其人，望其毗益萬分，興化致理，譬猶緣木求魚，升山採珠。」《孤本元明雜劇．卓文君．第三折》：「盼功名如守株待兔，要求進若緣木求魚。」也作「求魚緣木」。","footerHtml":"<div style=\"font-size:9px; color:#999999; margin-top:20px; line-height:1.6; text-align:center;\">中華民國教育部（Ministry of Education, R.O.C.）。《重編國語辭典修訂本》（版本編號：2015_20260625）<br>網址：http://dict.revised.moe.edu.tw/</div>","backTo":"idioms","backLabel":"回列表","sourceUrl":"https://dict.revised.moe.edu.tw/dictView.jsp?ID=165298&la=0&powerMode=0"},
    {"id":"idiom-moe-57071","title":"南轅北轍","date":"","boldTerms":["字　　詞","注　　音","漢語拼音","相 似 詞","相 反 詞","釋　　義"],"content":"字　　詞：南轅北轍\n注　　音：ㄋㄢˊ ㄩㄢˊ ㄅㄟˇ ㄔㄜˋ\n漢語拼音：nán yuán běi chè\n相 似 詞：背道而馳\n相 反 詞：異途同歸\n\n釋　　義：\n從太行山去楚國，本應駕車向南，但車夫卻向北行，結果離楚國越來越遠。典出《戰國策．魏策四》。比喻行動和目的彼此背道而馳。如：「這個結果與原先計畫，簡直是南轅北轍，相差太遠了！」也作「北轍南轅」、「北轅適楚」。","footerHtml":"<div style=\"font-size:9px; color:#999999; margin-top:20px; line-height:1.6; text-align:center;\">中華民國教育部（Ministry of Education, R.O.C.）。《重編國語辭典修訂本》（版本編號：2015_20260625）<br>網址：http://dict.revised.moe.edu.tw/</div>","backTo":"idioms","backLabel":"回列表","sourceUrl":"https://dict.revised.moe.edu.tw/dictView.jsp?ID=57071&la=0&powerMode=0"},
    {"id":"idiom-moe-111291","title":"虛懷若谷","date":"","boldTerms":["字　　詞","注　　音","漢語拼音","相 似 詞","相 反 詞","釋　　義"],"content":"字　　詞：虛懷若谷\n注　　音：ㄒㄩ ㄏㄨㄞˊ ㄖㄨㄛˋ ㄍㄨˇ\n漢語拼音：xū huái ruò gǔ\n相 反 詞：崖岸自高、不可一世、目空一切、夜郎自大、旁若無人\n\n釋　　義：\n心胸寬廣如山谷能容納萬物。形容為人謙虛，能接納他人的意見。《清史稿．卷三〇六．柴潮生傳》：「此誠我皇上虛懷若谷，從諫弗咈之盛心也。」","footerHtml":"<div style=\"font-size:9px; color:#999999; margin-top:20px; line-height:1.6; text-align:center;\">中華民國教育部（Ministry of Education, R.O.C.）。《重編國語辭典修訂本》（版本編號：2015_20260625）<br>網址：http://dict.revised.moe.edu.tw/</div>","backTo":"idioms","backLabel":"回列表","sourceUrl":"https://dict.revised.moe.edu.tw/dictView.jsp?ID=111291&la=0&powerMode=0"},
    {"id":"idiom-moe-21368","title":"不恥下問","date":"","boldTerms":["字　　詞","注　　音","漢語拼音","相 似 詞","相 反 詞","釋　　義"],"content":"字　　詞：不恥下問\n注　　音：ㄅㄨˋ ㄔˇ ㄒㄧㄚˋ ㄨㄣˋ\n漢語拼音：bù chǐ xià wèn\n\n釋　　義：\n語出《論語．公冶長》：「子曰：『敏而好學，不恥下問，是以謂之文也。』」不以向身分較低微、或是學問較自己淺陋的人求教為羞恥。《新唐書．卷一六二．列傳．獨孤及》：「然則多聞闕疑，不恥下問，聖人之心也。」《老殘遊記》第七回：「閣下既不恥下問，弟先須請宗旨何如？」","footerHtml":"<div style=\"font-size:9px; color:#999999; margin-top:20px; line-height:1.6; text-align:center;\">中華民國教育部（Ministry of Education, R.O.C.）。《重編國語辭典修訂本》（版本編號：2015_20260625）<br>網址：http://dict.revised.moe.edu.tw/</div>","backTo":"idioms","backLabel":"回列表","sourceUrl":"https://dict.revised.moe.edu.tw/dictView.jsp?ID=21368&q=1&word=%E4%B8%8B"},
    {"id":"idiom-moe-137158","title":"融會貫通","date":"","boldTerms":["字　　詞","注　　音","漢語拼音","相 似 詞","相 反 詞","釋　　義"],"content":"字　　詞：融會貫通\n注　　音：ㄖㄨㄥˊ ㄏㄨㄟˋ ㄍㄨㄢˋ ㄊㄨㄥ\n漢語拼音：róng huì guàn tōng\n相 反 詞：生吞活剝、囫圇吞棗\n\n釋　　義：\n將各種知識或事物加以融合、貫穿，進而獲得全面通徹的領會。《宋史．卷四二七．道學傳．序》：「於是上自帝王傳心之奧，下至初學入德之門，融會貫通，無復餘蘊。」《清史稿．卷四八二．儒林傳三．陳立傳》：「南歸後，乃整齊排比，融會貫通，成公羊義疏七十六卷。」","footerHtml":"<div style=\"font-size:9px; color:#999999; margin-top:20px; line-height:1.6; text-align:center;\">中華民國教育部（Ministry of Education, R.O.C.）。《重編國語辭典修訂本》（版本編號：2015_20260625）<br>網址：http://dict.revised.moe.edu.tw/</div>","backTo":"idioms","backLabel":"回列表","sourceUrl":"https://dict.revised.moe.edu.tw/dictView.jsp?ID=137158&la=0&powerMode=0"},
    {"id":"idiom-moe-76377","title":"刻舟求劍","date":"","boldTerms":["字　　詞","注　　音","漢語拼音","相 似 詞","相 反 詞","釋　　義"],"content":"字　　詞：刻舟求劍\n注　　音：ㄎㄜˋ ㄓㄡ ㄑㄧㄡˊ ㄐㄧㄢˋ\n漢語拼音：kè zhōu qiú jiàn\n相 似 詞：膠柱鼓瑟、食古不化、一成不變\n相 反 詞：因地制宜、因時制宜、相機行事\n\n釋　　義：\n楚人過江，劍掉水中，便於船舷刻一記號，待船停止，從刻記號處下水尋劍的故事。典出《呂氏春秋．慎大覽．察今》。後用以比喻拘泥固執，不知變通。宋．陸游〈謝梁右相啟〉：「刻舟求劍，固匪通材。」《紅樓夢》第一二〇回：「似你這樣尋根究底，便是刻舟求劍，膠柱鼓瑟了。」也作「求劍刻舟」。","footerHtml":"<div style=\"font-size:9px; color:#999999; margin-top:20px; line-height:1.6; text-align:center;\">中華民國教育部（Ministry of Education, R.O.C.）。《重編國語辭典修訂本》（版本編號：2015_20260625）<br>網址：http://dict.revised.moe.edu.tw/</div>","backTo":"idioms","backLabel":"回列表","sourceUrl":"https://dict.revised.moe.edu.tw/dictView.jsp?ID=76377&la=0&powerMode=0"},
    {"id":"idiom-moe-61136","title":"濫竽充數","date":"","boldTerms":["字　　詞","注　　音","漢語拼音","相 似 詞","相 反 詞","釋　　義"],"content":"字　　詞：濫竽充數\n注　　音：ㄌㄢˋ ㄩˊ ㄔㄨㄥ ㄕㄨˋ\n漢語拼音：làn yú chōng shù\n相 似 詞：碌碌無為、湊數其間、魚目混珠\n相 反 詞：出類拔萃\n\n釋　　義：\n戰國時，齊宣王喜聽吹竽之聲，且每次都要求三百人合吹。有位南郭處士，不會吹竽，但卻混雜其中，享受很好的待遇。宣王死後，湣王繼位，他喜歡聽一個人獨吹，南郭先生只好逃走。典出《韓非子．內儲說上》。比喻沒有真才實學的人，混在行家中充數；或比喻以不好的東西充場面；有時也用於自謙之辭。《兒女英雄傳》第三五回：「若只靠著才氣，摭些陳言，便不好濫竽充數了。」《官話指南．卷四．官話問答》：「我這不過是僥倖，實在是自愧無才，濫竽充數就是了！」","footerHtml":"<div style=\"font-size:9px; color:#999999; margin-top:20px; line-height:1.6; text-align:center;\">中華民國教育部（Ministry of Education, R.O.C.）。《重編國語辭典修訂本》（版本編號：2015_20260625）<br>網址：http://dict.revised.moe.edu.tw/</div>","backTo":"idioms","backLabel":"回列表","sourceUrl":"https://dict.revised.moe.edu.tw/dictView.jsp?ID=61136&la=0&powerMode=0"},
    {"id":"idiom-moe-152313","title":"揠苗助長","date":"","boldTerms":["字　　詞","注　　音","漢語拼音","相 似 詞","相 反 詞","釋　　義"],"content":"字　　詞：揠苗助長\n注　　音：ㄧㄚˋ ㄇㄧㄠˊ ㄓㄨˋ ㄓㄤˇ\n漢語拼音：yà miáo zhù zhǎng\n相 似 詞：適得其反、欲速不達\n相 反 詞：循序漸進\n\n釋　　義：\n古時宋國人因他種的苗未長高，而用手將它拉高，結果苗卻反而枯死了。典出《孟子．公孫丑上》。比喻為求速成而未循序漸進，結果不但無益，反而有害。宋．呂本中《紫微雜說》：「學問功夫全在浹洽涵養蘊蓄之久……非如世人強襲取之，揠苗助長，苦心極力，卒無所得也。」也作「拔苗助長」。","footerHtml":"<div style=\"font-size:9px; color:#999999; margin-top:20px; line-height:1.6; text-align:center;\">中華民國教育部（Ministry of Education, R.O.C.）。《重編國語辭典修訂本》（版本編號：2015_20260625）<br>網址：http://dict.revised.moe.edu.tw/</div>","backTo":"idioms","backLabel":"回列表","sourceUrl":"https://dict.revised.moe.edu.tw/dictView.jsp?ID=152313&la=1&powerMode=0"},
    {"id":"idiom-moe-147680","title":"嘔心瀝血","date":"","boldTerms":["字　　詞","注　　音","漢語拼音","相 似 詞","相 反 詞","釋　　義"],"content":"字　　詞：嘔心瀝血\n注　　音：ㄡˇ ㄒㄧㄣ ㄌㄧˋ ㄒㄩㄝˋ\n漢語拼音：ǒu xīn lì xuè\n相 似 詞：費盡心血、煞費苦心、挖空心思、用盡心思、處心積慮\n\n釋　　義：\n吐出心，滴盡血。比喻費盡心血，用盡心思。如：「這些書是作者嘔心瀝血的成果，絕不容許不肖商人盜版。」也作「瀝血叩心」、「嘔心吐膽」。","footerHtml":"<div style=\"font-size:9px; color:#999999; margin-top:20px; line-height:1.6; text-align:center;\">中華民國教育部（Ministry of Education, R.O.C.）。《重編國語辭典修訂本》（版本編號：2015_20260625）<br>網址：http://dict.revised.moe.edu.tw/</div>","backTo":"idioms","backLabel":"回列表","sourceUrl":"https://dict.revised.moe.edu.tw/dictView.jsp?ID=147680&la=0&powerMode=0"},
    {"id":"idiom-moe-136208","title":"任重道遠","date":"","boldTerms":["字　　詞","注　　音","漢語拼音","相 似 詞","相 反 詞","釋　　義"],"content":"字　　詞：任重道遠\n注　　音：ㄖㄣˋ ㄓㄨㄥˋ ㄉㄠˋ ㄩㄢˇ\n漢語拼音：rèn zhòng dào yuǎn\n\n釋　　義：\n負擔繁重，路途遙遠。比喻長期肩負重大的任務。語出《論語．泰伯》：「士不可以不弘毅，任重而道遠。」《商君書．弱民》：「背法而治，此任重道遠而無馬牛，濟大川而無舡楫也。」也作「道遠任重」。","footerHtml":"<div style=\"font-size:9px; color:#999999; margin-top:20px; line-height:1.6; text-align:center;\">中華民國教育部（Ministry of Education, R.O.C.）。《重編國語辭典修訂本》（版本編號：2015_20260625）<br>網址：http://dict.revised.moe.edu.tw/</div>","backTo":"idioms","backLabel":"回列表","sourceUrl":"https://dict.revised.moe.edu.tw/dictView.jsp?ID=136208&la=0&powerMode=0"},
    {"id":"idiom-moe-14326","title":"百折不撓","date":"","boldTerms":["字　　詞","注　　音","漢語拼音","相 似 詞","相 反 詞","釋　　義"],"content":"字　　詞：百折不撓\n注　　音：ㄅㄞˇ ㄓㄜˊ ㄅㄨˋ ㄋㄠˊ\n漢語拼音：bǎi zhé bù náo\n相 似 詞：百折不回、百折不挫、不屈不撓、堅韌不拔、絕不屈服\n相 反 詞：知難而退、因噎廢食、一蹶不振\n\n釋　　義：\n意志剛強，雖受盡挫折，仍能堅持不變，奮鬥到底。漢．蔡邕〈太尉喬玄碑〉：「其性莊，疾華尚樸，有百折不撓，臨大節而可不奪之風。」也作「百折不回」、「百折不挫」。","footerHtml":"<div style=\"font-size:9px; color:#999999; margin-top:20px; line-height:1.6; text-align:center;\">中華民國教育部（Ministry of Education, R.O.C.）。《重編國語辭典修訂本》（版本編號：2015_20260625）<br>網址：http://dict.revised.moe.edu.tw/</div>","backTo":"idioms","backLabel":"回列表","sourceUrl":"https://dict.revised.moe.edu.tw/dictView.jsp?ID=14326&la=0&powerMode=0"},
    {"id":"idiom-moe-32443","title":"明察秋毫","date":"","boldTerms":["字　　詞","注　　音","漢語拼音","相 似 詞","相 反 詞","釋　　義"],"content":"字　　詞：明察秋毫\n注　　音：ㄇㄧㄥˊ ㄔㄚˊ ㄑㄧㄡ ㄏㄠˊ\n漢語拼音：míng chá qiū háo\n相 反 詞：鼠目寸光\n\n釋　　義：\n目光敏銳，觀察入微，可看見秋天鳥獸新長的毫毛。《孟子．梁惠王上》：「明足以察秋毫之末，而不見輿薪。」比喻能洞察一切，看出極細微的地方。《三俠五義》第四二回：「不想相爺神目如電，早已明察秋毫，小人再也不敢隱瞞。」","footerHtml":"<div style=\"font-size:9px; color:#999999; margin-top:20px; line-height:1.6; text-align:center;\">中華民國教育部（Ministry of Education, R.O.C.）。《重編國語辭典修訂本》（版本編號：2015_20260625）<br>網址：http://dict.revised.moe.edu.tw/</div>","backTo":"idioms","backLabel":"回列表","sourceUrl":"https://dict.revised.moe.edu.tw/dictView.jsp?ID=32443&la=0&powerMode=0"},
    {"id":"idiom-moe-49011","title":"洞若觀火","date":"","boldTerms":["字　　詞","注　　音","漢語拼音","相 似 詞","相 反 詞","釋　　義"],"content":"字　　詞：洞若觀火\n注　　音：ㄉㄨㄥˋ ㄖㄨㄛˋ ㄍㄨㄢ ㄏㄨㄛˇ\n漢語拼音：dòng ruò guān huǒ\n相 似 詞：了如指掌\n\n釋　　義：\n觀察事物非常清楚透澈。明．沈采《千金記》第一七齣：「老相明炳機先，洞若觀火。」也作「明若觀火」、「洞如觀火」。","footerHtml":"<div style=\"font-size:9px; color:#999999; margin-top:20px; line-height:1.6; text-align:center;\">中華民國教育部（Ministry of Education, R.O.C.）。《重編國語辭典修訂本》（版本編號：2015_20260625）<br>網址：http://dict.revised.moe.edu.tw/</div>","backTo":"idioms","backLabel":"回列表","sourceUrl":"https://dict.revised.moe.edu.tw/dictView.jsp?ID=49011&la=0&powerMode=0"},
    {"id":"idiom-moe-149881","title":"一葉障目，不見泰山","date":"","boldTerms":["字　　詞","注　　音","漢語拼音","相 似 詞","相 反 詞","釋　　義"],"content":"字　　詞：一葉障目，不見泰山\n注　　音：ㄧ ㄧㄝˋ ㄓㄤˋ ㄇㄨˋ， ㄅㄨˋ ㄐㄧㄢˋ ㄊㄞˋ ㄕㄢ\n漢語拼音：yī yè zhàng mù ， bù jiàn tài shān\n\n釋　　義：\n一片樹葉遮住眼睛，就無法看到眼前高大的泰山。比喻為局部或暫時的現象所迷惑，無法認清全面或根本的問題。如：「凡事要多從不同角度思考，以免一葉障目，不見泰山。」也作「一葉蔽目，不見泰山」。","footerHtml":"<div style=\"font-size:9px; color:#999999; margin-top:20px; line-height:1.6; text-align:center;\">中華民國教育部（Ministry of Education, R.O.C.）。《重編國語辭典修訂本》（版本編號：2015_20260625）<br>網址：http://dict.revised.moe.edu.tw/</div>","backTo":"idioms","backLabel":"回列表","sourceUrl":"https://dict.revised.moe.edu.tw/dictView.jsp?ID=149881&la=0&powerMode=0"},
    {"id":"idiom-moe-129358","title":"捨本逐末","date":"","boldTerms":["字　　詞","注　　音","漢語拼音","相 似 詞","相 反 詞","釋　　義"],"content":"字　　詞：捨本逐末\n注　　音：ㄕㄜˇ ㄅㄣˇ ㄓㄨˊ ㄇㄛˋ\n漢語拼音：shě běn zhú mò\n相 似 詞：本末倒置\n\n釋　　義：\n不求事物的根本大端而只重視微末小節。北魏．賈思勰〈齊民要術序〉：「捨本逐末，賢哲所非。」也作「舍本事末」。","footerHtml":"<div style=\"font-size:9px; color:#999999; margin-top:20px; line-height:1.6; text-align:center;\">中華民國教育部（Ministry of Education, R.O.C.）。《重編國語辭典修訂本》（版本編號：2015_20260625）<br>網址：http://dict.revised.moe.edu.tw/</div>","backTo":"idioms","backLabel":"回列表","sourceUrl":"https://dict.revised.moe.edu.tw/dictView.jsp?ID=129358&la=0&powerMode=0"},
    {"id":"idiom-moe-28002","title":"買櫝還珠","date":"","boldTerms":["字　　詞","注　　音","漢語拼音","相 似 詞","相 反 詞","釋　　義"],"content":"字　　詞：買櫝還珠\n注　　音：ㄇㄞˇ ㄉㄨˊ ㄏㄨㄢˊ ㄓㄨ\n漢語拼音：mǎi dú huán zhū\n\n釋　　義：\n楚國一位珠寶商人到鄭國賣珠寶，一人出高價買去，但他只看中精美的匣子，遂將珍珠還給珠寶商。典出《韓非子．外儲說左上》。後比喻捨本逐末，取捨失當。清．朱彞尊〈跋李紫篔畫卷〉：「然鄭人買櫝還珠，珠固在，庸何傷。」也作「得匣還珠」。","footerHtml":"<div style=\"font-size:9px; color:#999999; margin-top:20px; line-height:1.6; text-align:center;\">中華民國教育部（Ministry of Education, R.O.C.）。《重編國語辭典修訂本》（版本編號：2015_20260625）<br>網址：http://dict.revised.moe.edu.tw/</div>","backTo":"idioms","backLabel":"回列表","sourceUrl":"https://dict.revised.moe.edu.tw/dictView.jsp?ID=28002&la=0&powerMode=0"},
    {"id":"idiom-moe-17012","title":"本末倒置","date":"","boldTerms":["字　　詞","注　　音","漢語拼音","相 似 詞","相 反 詞","釋　　義"],"content":"字　　詞：本末倒置\n注　　音：ㄅㄣˇ ㄇㄛˋ ㄉㄠˋ ㄓˋ\n漢語拼音：běn mò dào zhì\n相 似 詞：輕重倒置、捨本逐末\n\n釋　　義：\n事物的主次顛倒。比喻不知事情的輕重緩急。清．王昶《金石萃編．卷一五八．金五．綏德州新學記》：「然非知治之審，則亦未嘗不本末倒置。」也作「本末顛倒」、「本末舛逆」。","footerHtml":"<div style=\"font-size:9px; color:#999999; margin-top:20px; line-height:1.6; text-align:center;\">中華民國教育部（Ministry of Education, R.O.C.）。《重編國語辭典修訂本》（版本編號：2015_20260625）<br>網址：http://dict.revised.moe.edu.tw/</div>","backTo":"idioms","backLabel":"回列表","sourceUrl":"https://dict.revised.moe.edu.tw/dictView.jsp?ID=17012&la=0&powerMode=0"},
    {"id":"shijin-bumei","title":"拾金不昧","date":"","boldTerms":["字　　詞","注　　音","漢語拼音","相 似 詞","釋　　義","相 反 詞"],"content":"字　　詞：拾金不昧\n注　　音：ㄕˊ ㄐㄧㄣ ㄅㄨˋ ㄇㄟˋ\n漢語拼音：shí jīn bù mèi\n\n釋　　義：\n揀到別人遺失的錢財而不據為己有。\n清．吳熾昌《客窗閑話．卷三．義丐》：「乃呼里長，為之謀宅於市廛，置貨立業，且表之以額曰『拾金不昧。』」\n《歧路燈》第一〇八回：「把家人名分扯倒，又表其拾金不昧。」","footerHtml":"<div style=\"font-size:9px; color:#999999; margin-top:20px; line-height:1.6; text-align:center;\">中華民國教育部（Ministry of Education, R.O.C.）。《重編國語辭典修訂本》（版本編號：2015_20260625）<br>網址：http://dict.revised.moe.edu.tw/</div>","backTo":"idioms","backLabel":"回列表"},
    {"id":"hujia-huwei","title":"狐假虎威","date":"","boldTerms":["字　　詞","注　　音","漢語拼音","相 似 詞","釋　　義","相 反 詞"],"content":"字　　詞：狐假虎威\n注　　音：ㄏㄨˊ ㄐㄧㄚˇ ㄏㄨˇ ㄨㄟ\n漢語拼音：hú jiǎ hǔ wēi\n相 似 詞：狗仗人勢、仗勢欺人、恃勢凌人\n\n釋　　義：\n狐狸與老虎同行，借老虎的威風嚇走百獸，卻使老虎誤信百獸乃畏狐狸而走。見《戰國策．楚策一》。\n後比喻憑恃有權者的威勢恐嚇他人、作威作福。\n《警世通言．卷三一．趙春兒重旺曹家莊》：「居中的人還要扣些謝禮，他把中人就自看做一半債主，狐假虎威，需索不休。」\n《文明小史》第三〇回：「這些人只要等到署了個缺，得了個差使，就狐假虎威的發作起來了。」也作「狐虎之威」、「狐藉虎威」、「虎威狐假」。","footerHtml":"<div style=\"font-size:9px; color:#999999; margin-top:20px; line-height:1.6; text-align:center;\">中華民國教育部（Ministry of Education, R.O.C.）。《重編國語辭典修訂本》（版本編號：2015_20260625）<br>網址：http://dict.revised.moe.edu.tw/</div>","backTo":"idioms","backLabel":"回列表"},
    {"id":"huashe-tianzu","title":"畫蛇添足","date":"","boldTerms":["字　　詞","注　　音","漢語拼音","相 似 詞","釋　　義","相 反 詞"],"content":"字　　詞：畫蛇添足\n注　　音：ㄏㄨㄚˋ ㄕㄜˊ ㄊㄧㄢ ㄗㄨˊ\n漢語拼音：huà shé tiān zú\n相 似 詞：多此一舉、節外生枝\n\n釋　　義：\n戰國時有楚人以比賽畫蛇決定誰可以喝酒，有人畫好後又添畫四隻腳，此時第二個人也已畫成，第一個人則因為多畫了根本不存在的蛇足，反而失去本已贏得的酒。\n典出《戰國策．齊策二》。後比喻多此一舉而於事無補。\n《三國演義》第一一〇回：「將軍功績已成，威聲大震，可以止矣。今若前進，倘不如意，正如畫蛇添足也。」\n也作「畫蛇著足」、「為蛇添足」、「為蛇畫足」。","footerHtml":"<div style=\"font-size:9px; color:#999999; margin-top:20px; line-height:1.6; text-align:center;\">中華民國教育部（Ministry of Education, R.O.C.）。《重編國語辭典修訂本》（版本編號：2015_20260625）<br>網址：http://dict.revised.moe.edu.tw/</div>","backTo":"idioms","backLabel":"回列表"},
    {"id":"shouzhu-daitu","title":"守株待兔","date":"","boldTerms":["字　　詞","注　　音","漢語拼音","相 似 詞","釋　　義","相 反 詞"],"content":"字　　詞：守株待兔\n注　　音：ㄕㄡˇ ㄓㄨ ㄉㄞˋ ㄊㄨˋ\n漢語拼音：shǒu zhū dài tù\n\n釋　　義：\n相傳一農夫見兔觸樹而死，為他所得，遂不事農作，守在樹旁，等待兔子撞樹，終一無所獲。\n典出《韓非子．五蠹》。後比喻拘泥守成，不知變通或妄想不勞而獲。\n漢．王充《論衡．宣漢》：「以已至之瑞，效方來之應，猶守株待兔之蹊，藏身破罝之路也。」\n明．朱權《卓文君》第三折：「盼功名如守株待兔，要求進若緣木求魚。」也作「守株伺兔」。","footerHtml":"<div style=\"font-size:9px; color:#999999; margin-top:20px; line-height:1.6; text-align:center;\">中華民國教育部（Ministry of Education, R.O.C.）。《重編國語辭典修訂本》（版本編號：2015_20260625）<br>網址：http://dict.revised.moe.edu.tw/</div>","backTo":"idioms","backLabel":"回列表"},
    {"id":"xuezhong-songtan","title":"雪中送炭","date":"","boldTerms":["字　　詞","注　　音","漢語拼音","相 似 詞","釋　　義","相 反 詞"],"content":"字　　詞：雪中送炭\n注　　音：ㄒㄩㄝˇ ㄓㄨㄥ ㄙㄨㄥˋ ㄊㄢˋ\n漢語拼音：xuě zhōng sòng tàn\n相 似 詞：濟困解危\n相 反 詞：乘人之危、錦上添花、雪上加霜、趁火打劫、落井下石\n\n釋　　義：\n比喻在人艱困危急之時，給予適時的援助。\n《初刻拍案驚奇》卷二〇：「只有錦上添花，那得雪中送炭？」\n也作「雪裡送炭」。","footerHtml":"<div style=\"font-size:9px; color:#999999; margin-top:20px; line-height:1.6; text-align:center;\">中華民國教育部（Ministry of Education, R.O.C.）。《重編國語辭典修訂本》（版本編號：2015_20260625）<br>網址：http://dict.revised.moe.edu.tw/</div>","backTo":"idioms","backLabel":"回列表"},
    {"id":"jingdi-zhiwa","title":"井底之蛙","date":"","boldTerms":["字　　詞","注　　音","漢語拼音","相 似 詞","釋　　義","相 反 詞"],"content":"字　　詞：井底之蛙\n注　　音：ㄐㄧㄥˇ ㄉㄧˇ ㄓ ㄨㄚ\n漢語拼音：jǐng dǐ zhī wā\n\n釋　　義：\n比喻見識淺薄的人。\n如：「此人有如井底之蛙，卻還高談闊論，實在好笑！」\n《三國演義》第一一三回：「汝乃井底之蛙，安知玄奧乎！」\n《紅樓夢》第四九回：「可知我井底之蛙，成日家只說現在的這幾個人是有一無二的。」","footerHtml":"<div style=\"font-size:9px; color:#999999; margin-top:20px; line-height:1.6; text-align:center;\">中華民國教育部（Ministry of Education, R.O.C.）。《重編國語辭典修訂本》（版本編號：2015_20260625）<br>網址：http://dict.revised.moe.edu.tw/</div>","backTo":"idioms","backLabel":"回列表"},
    {"id":"yugong-yishan","title":"愚公移山","date":"","boldTerms":["字　　詞","注　　音","漢語拼音","相 似 詞","釋　　義"],"content":"字　　詞：愚公移山\n注　　音：ㄩˊ ㄍㄨㄥ ㄧˊ ㄕㄢ\n漢語拼音：yú gōng yí shān\n相 似 詞：鐵杵磨針、鐵杵成針\n\n釋　　義：\n相傳北山愚公苦於家門前有太形、王屋二山阻攔出路，因而率領子孫挖掘土石，決心鏟平二山。後天帝為其真誠所感動，於是命夸蛾氏二子背負二山，移去他地。見《列子．湯問》。\n後以愚公移山比喻努力不懈，不畏艱難，自能成事。\n如：「這件事確實不易，但如果效法愚公移山的精神，還怕不會成功嗎？」\n清．黃宗羲〈張蒼水墓誌〉：「愚公移山，精衛填海，常人藐為說鈴，賢聖指為血路也。」","footerHtml":"<div style=\"font-size:9px; color:#999999; margin-top:20px; line-height:1.6; text-align:center;\">中華民國教育部（Ministry of Education, R.O.C.）。《重編國語辭典修訂本》（版本編號：2015_20260625）<br>網址：http://dict.revised.moe.edu.tw/</div>","backTo":"idioms","backLabel":"回列表"},
    { id: 'variant-characters', title: '神祕的異體字', date: '', backTo: 'search', backLabel: '回搜尋結果',
      htmlContent: `
        <div style="font-size:14px; line-height:1.9;">
          <p>異體字是指讀音、意思都相同，僅字形不同的漢字。</p>
          <p>異體字又可分為兩種：在任何情況下讀音和意義都一樣的異體字，和只在某些情況下才相通的異體字。有時候，異體字特指與官方正體字相對應的規範外的異體字，因而隨著各中文地區對正體字的不同認定，哪些字是另一些字的異體字，甚至完全相反。</p>
          <p>例如：在台灣，「够」是「夠」的異體字，「强」是「強」的異體字，在大陸卻完全相反喔！</p>
          <p>以下是一些特殊的異體字，一起來看看吧！</p>
          <table style="border-collapse:collapse; margin:18px auto; min-width:280px; font-size:16px; text-align:center;" border="1" cellpadding="7" cellspacing="0">
            <thead><tr><th style="background:#eeeeee;">正體字</th><th style="background:#eeeeee;">異體字</th></tr></thead>
            <tbody>
              <tr><td>咒</td><td>呪</td></tr>
              <tr><td>死</td><td>𤯽</td></tr>
              <tr><td>群</td><td>羣</td></tr>
              <tr><td>峰</td><td>峯</td></tr>
              <tr><td>溫</td><td>温</td></tr>
              <tr><td>𠔽</td><td>人</td></tr>
              <tr><td>犇</td><td>奔</td></tr>
              <tr><td>𩲡</td><td>鬼</td></tr>
              <tr><td>蛇</td><td>虵</td></tr>
              <tr><td>𥜩</td><td>神</td></tr>
            </tbody>
          </table>
        </div>` },
    { id: 'goodbye', title: '再見', date: '2009-04-09', content: '老師，很抱歉擅自修改了您託付給我的網站\n我只是想要找個地方，把我做過的事情都說出來\n但我是個無比膽小的人，只能用這樣拐彎抹角的形式\n\n我累了，耳邊的聲音越來越多，陳秋虎死了，但我的心什麼感覺都沒有\n這裡大概不會再更新了，寫完這則日誌後，我也差不多該走了\n謝謝老師和師母對我的照顧，謝謝你們聽我說話，謝謝你們給了我家庭的溫暖，謝謝你們讓我得到了本不屬於我的幸福\n謝謝你們願意愛我' },
    {"id":"bazi-image","title":"紅顏薄命","date":"","boldTerms":["字　　詞","注　　音","漢語拼音","相 似 詞","釋　　義"],"content":"字　　詞：紅顏薄命\n注　　音：ㄏㄨㄥˊ ㄧㄢˊ ㄅㄛˊ ㄇㄧㄥˋ\n漢語拼音：hóng yán bó mìng\n相 似 詞：命薄如花\n\n釋　　義：\n嘆息美女的命運不佳。\n元．無名氏《鴛鴦被》第三折：「總則我紅顏薄命，真心兒待嫁劉彥明，偶然間卻遇張瑞卿。」\n《隋唐演義》第三四回：「大凡人做了個女身，已是不幸的了；而又棄父母，拋親戚，點入宮來，只道紅顏薄命，如同腐草，即填溝壑。」\n也作「美人命薄」、「紅顏命薄」。","footerHtml":"<div style=\"font-size:9px; color:#999999; margin-top:20px; line-height:1.6; text-align:center;\">中華民國教育部（Ministry of Education, R.O.C.）。《重編國語辭典修訂本》（版本編號：2015_20260625）<br>網址：http://dict.revised.moe.edu.tw/</div>","imagePosition":"bottom","imageAsLink":true,"imageLinkLabel":"八字算法.jpg","backTo":"idioms","backLabel":"回列表","image":"https://images.plurk.com/4oRtYEyEQI2RYNKgBBizDx.jpg"},

let _pendingViewImage = '';
let _pendingViewImageTitle = '';

function openBlogImageNewTab() {
    if (!_pendingViewImage) return;
    const w = window.open('', '_blank');
    if (!w) { alert('請允許瀏覽器彈出視窗以檢視圖片！'); return; }
    w.document.open();
    w.document.write(
        '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>' +
        (_pendingViewImageTitle || '圖片') +
        '</title><style>html,body{margin:0;padding:0;background:#333333;}img{display:block;}</style>' +
        '</head><body><img src="' + _pendingViewImage + '" alt=""></body></html>'
    );
    w.document.close();
}

function openBlogImage() {
    document.getElementById('imageViewImg').src = _pendingViewImage;
    document.getElementById('imageViewTitle').textContent = _pendingViewImageTitle || '圖片';
    showScreen('image-view');
}

function openBlogPost(id) {
    let post = loadBlogPosts().find(p => p.id === id);
    if (!post) {
        post = SPECIAL_POSTS.find(p => p.id === id && p.id !== 'goodbye');
    }
    if (!post) return;
    document.getElementById('blogPostTitle').textContent = post.title;
    document.getElementById('blogPostDate').textContent = post.date;
    let textHtml = post.htmlContent || escapeHtml(post.content || '').replace(/\n/g, '<br>');
    if (post.boldTerms) {
        post.boldTerms.forEach(function (t) {
            textHtml = textHtml.split(t).join('<b>' + t + '</b>');
        });
    }
    if (id === 'buru-guiqu') {
        textHtml = textHtml.replace('<b>大火</b>', '<b style="font-size:larger;">大火</b>')

function stopReturnPopups() {
    clearTimeout(window.returnPopupDelay);
    clearInterval(window.returnPopupInterval);
    document.querySelectorAll('.return-popup').forEach(el => el.remove());
}
function startReturnPopups() {
    stopReturnPopups();
    function spawn() {
        if (!document.documentElement.classList.contains('inverted-idiom')) { stopReturnPopups(); return; }
        const existing = document.querySelectorAll('.return-popup');
        if (existing.length >= 30) existing[0].remove();
        const box = document.createElement('div');
        box.className = 'return-popup';
        box.setAttribute('role', 'dialog');
        box.setAttribute('aria-label', '不如歸去');
        box.style.cssText = 'position:absolute;z-index:99999;box-sizing:border-box;width:220px;max-width:calc(100vw - 16px);padding:20px;background:#000;color:#ff2222;border:1px solid #ff2222;text-align:center;box-shadow:3px 3px 0 #0008;filter:invert(1);font-size:20px;';
        const message = document.createElement('div');
        message.textContent = '不如歸去';
        const button = document.createElement('button');
        button.textContent = '好';
        button.style.cssText = 'display:block;margin:16px auto 0;padding:3px 22px;background:#000;color:#ff2222;border:1px solid #ff2222;cursor:pointer;font:inherit;font-size:16px;';
        button.onclick = () => { stopReturnPopups(); window.location.assign('?screen=weimin'); };
        box.append(message, button);
        document.body.appendChild(box);
        box.style.left = (window.scrollX + 8 + Math.random() * Math.max(0, window.innerWidth - box.offsetWidth - 16)) + 'px';
        box.style.top = (window.scrollY + 8 + Math.random() * Math.max(0, window.innerHeight - box.offsetHeight - 16)) + 'px';
    }
    window.returnPopupDelay = setTimeout(() => {
        spawn();
        window.returnPopupInterval = setInterval(spawn, 1200);
    }, 2500);
}

function renderAdminBlogManage(page) {
    const posts = loadBlogPosts().slice().sort((a, b) => (a.date < b.date ? 1 : -1));
    const perPage = 10;
    const totalPages = Math.max(1, Math.ceil(posts.length / perPage));
    const currentPage = Math.max(1, Math.min(totalPages, Number.isInteger(page) ? page : (window.adminBlogManagePage || 1)));
    window.adminBlogManagePage = currentPage;
    const container = document.getElementById('blogManageList');
    container.innerHTML = '';
    if (posts.length === 0) {
        container.innerHTML = '<p style="font-size:13px; color:#888888;">目前尚無日誌。</p>';
        return;
    }
    posts.slice((currentPage - 1) * perPage, currentPage * perPage).forEach(p => {
        const row = document.createElement('div');
        row.className = 'blog-manage-list-item';
        const label = document.createElement('span');
        label.innerHTML = escapeHtml(p.title) + '　<span style="color:#888888;">(' + escapeHtml(p.date) + ')</span>';
        const actions = document.createElement('span');
        const delBtn = document.createElement('a');
        delBtn.href = '#';
        delBtn.onclick = e => e.preventDefault();
        delBtn.className = 'admin-text-link';
        delBtn.textContent = '刪除';
        const editBtn = document.createElement('a');
        editBtn.href = '#';
        editBtn.onclick = e => e.preventDefault();
        editBtn.className = 'admin-text-link';
        editBtn.textContent = '編輯';
        actions.appendChild(delBtn);
        actions.appendChild(editBtn);
        row.appendChild(label);
        row.appendChild(actions);
        container.appendChild(row);
    });
    if (totalPages > 1) {
        const pager = document.createElement('div');
        pager.style.cssText = 'text-align:center;margin-top:12px;font-size:12px;';
        if (currentPage > 1) {
            const prev = document.createElement('a');
            prev.href = '#';
            prev.className = 'admin-text-link';
            prev.textContent = '上一頁';
            prev.onclick = e => { e.preventDefault(); renderAdminBlogManage(currentPage - 1); };
            pager.appendChild(prev);
        }
        const info = document.createElement('span');
        info.style.margin = '0 10px';
        info.textContent = currentPage + ' / ' + totalPages;
        pager.appendChild(info);
        if (currentPage < totalPages) {
            const next = document.createElement('a');
            next.href = '#';
            next.className = 'admin-text-link';
            next.textContent = '下一頁';
            next.onclick = e => { e.preventDefault(); renderAdminBlogManage(currentPage + 1); };
            pager.appendChild(next);
        }
        container.appendChild(pager);
    }
}

        { key: '大火', type: '留言板', title: '留言板>已封存的留言>2007.03.21', href: '?screen=archived-message-20070321', action: () => showScreen('archived-message-20070321') },

        { key: '鐵樹', id: 'blog20050412', type: '日誌', title: '站長日誌＞關於筆名' }
    ];
    /* 完全相符才算命中（前後空白已去除，英文不分大小寫） */

}
